<title>ワンポチ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 世界観: 絵本の小さな庭。空→丘→草原の上に相棒がいて、ボタンはおもちゃみたいに厚みがある。親の画面=庭＋きょうの1問。家族の画面=同じ世界の「日記帳」 */
:root{
  --bg:#EAF6FB; --fg:#3B2F2A; --muted:#8A7468; --card:#FFFBF0; --card2:#FFF3DC;
  --edge:#E6D3AE; --edge-dark:#CDB389;
  --accent:#FF6B4A; --accent-dark:#D9472A; --accent-fg:#FFFFFF;
  --ok:#3FA85B; --ok-bg:#DDF5DD; --warn:#D98A1C; --warn-bg:#FFF0C8; --bad:#E2503F; --bad-bg:#FFE1DC;
  --family:#4C7BD9; --family-dark:#355FB3; --family-bg:#DDE9FF;
  --p1:#FFE1D1; --p2:#DDF3E4; --p3:#E8E0FF; --p4:#F1EDE4;
  --sky-top:#BFE4F8; --sky-bottom:#EEF8FC; --hill-far:#BDE6A4; --hill-near:#8FD070; --grass:#6CBF5A; --tuft:#4FA347;
  --sun:#FFD166; --cloud:#FFFFFF; --star:#FFF4C2; --flower1:#FF8FAB; --flower2:#FFD93D; --paw:#5FAE52;
  --show-sun:1; --show-moon:0;
  --demo-bg:rgba(59,47,42,.08); --demo-fg:#5E4C44; --demo-btn:#FFFFFF;
  --shadow:0 4px 14px rgba(70,50,20,.12);
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2A3A5E; --fg:#F4ECDC; --muted:#B8A99A; --card:#222A40; --card2:#2C3550;
    --edge:#4B5273; --edge-dark:#161B2B;
    --accent:#FF8A6A; --accent-dark:#C8563C; --accent-fg:#1D1510;
    --ok:#74D48E; --ok-bg:#1F3A2A; --warn:#F2BC5A; --warn-bg:#3E3016; --bad:#FF8578; --bad-bg:#4A2420;
    --family:#93B6FF; --family-dark:#5C7FD1; --family-bg:#24324F;
    --p1:#4A3632; --p2:#2A4A3A; --p3:#3A3456; --p4:#3A3F55;
    --sky-top:#17203B; --sky-bottom:#2F4470; --hill-far:#2E5A52; --hill-near:#2C6E55; --grass:#2F7C52; --tuft:#3F9A66;
    --sun:#FFE9A8; --cloud:#3E4F78; --star:#FFF4C2; --flower1:#E07A95; --flower2:#E8C84A; --paw:#3F9A66;
    --show-sun:0; --show-moon:1;
    --demo-bg:rgba(255,255,255,.08); --demo-fg:#D7CFC2; --demo-btn:#3A4260;
    --shadow:0 4px 14px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2A3A5E; --fg:#F4ECDC; --muted:#B8A99A; --card:#222A40; --card2:#2C3550;
  --edge:#4B5273; --edge-dark:#161B2B;
  --accent:#FF8A6A; --accent-dark:#C8563C; --accent-fg:#1D1510;
  --ok:#74D48E; --ok-bg:#1F3A2A; --warn:#F2BC5A; --warn-bg:#3E3016; --bad:#FF8578; --bad-bg:#4A2420;
  --family:#93B6FF; --family-dark:#5C7FD1; --family-bg:#24324F;
  --p1:#4A3632; --p2:#2A4A3A; --p3:#3A3456; --p4:#3A3F55;
  --sky-top:#17203B; --sky-bottom:#2F4470; --hill-far:#2E5A52; --hill-near:#2C6E55; --grass:#2F7C52; --tuft:#3F9A66;
  --sun:#FFE9A8; --cloud:#3E4F78; --star:#FFF4C2; --flower1:#E07A95; --flower2:#E8C84A; --paw:#3F9A66;
  --show-sun:0; --show-moon:1;
  --demo-bg:rgba(255,255,255,.08); --demo-fg:#D7CFC2; --demo-btn:#3A4260;
  --shadow:0 4px 14px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--fg);
  background:var(--bg);
  background-image:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 42%, var(--bg) 100%);
  background-attachment:fixed;
  font-family:var(--font-display); font-size:17px; line-height:1.6;
  padding-block:12px 44px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; -webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
h1,h2,h3{margin:0; font-family:var(--font-display); text-wrap:balance; line-height:1.3}
p{margin:0}
.ico{width:1.1em; height:1.1em; vertical-align:-.18em; fill:currentColor; flex:0 0 auto}

/* おもちゃボタン（厚みあり） */
.toy{border:3px solid var(--edge); border-radius:22px; background:var(--card); box-shadow:0 6px 0 var(--edge-dark); transition:transform .08s, box-shadow .08s}
.toy:active{transform:translateY(6px); box-shadow:0 0 0 var(--edge-dark)}
.toy.accent{background:var(--accent); border-color:var(--accent-dark); color:var(--accent-fg); box-shadow:0 6px 0 var(--accent-dark)}
.toy.family{background:var(--family); border-color:var(--family-dark); color:#fff; box-shadow:0 6px 0 var(--family-dark)}
.toy:disabled{transform:none; box-shadow:0 6px 0 var(--edge-dark); opacity:.6; cursor:default}

/* 試作メニュー（本番には無い） */
.demo{background:var(--demo-bg); color:var(--demo-fg); border-radius:16px; padding:8px 12px; display:flex; flex-direction:column; gap:6px; font-size:13px; font-family:var(--font-body)}
.demo .row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.demo .lbl{opacity:.7; margin-right:2px}
.demo button{background:var(--demo-btn); border-radius:999px; padding:5px 12px; font-size:13px; font-weight:700; border:2px solid transparent}
.demo button[aria-pressed="true"]{background:var(--accent); color:var(--accent-fg); border-color:var(--accent-dark)}
.demo .day{font-variant-numeric:tabular-nums; margin-left:auto; opacity:.85}

/* ===== 親の画面 ===== */
.parent{display:flex; flex-direction:column; gap:18px}
.stage{position:relative; height:360px; border-radius:34px; overflow:hidden; border:4px solid var(--card); box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:18px 14px 0}
.scene{position:absolute; inset:0; width:100%; height:100%; z-index:0}
.scene .rays{transform-box:fill-box; transform-origin:center; animation:spin 48s linear infinite}
.scene .sun{opacity:var(--show-sun)} .scene .moon,.scene .stars{opacity:var(--show-moon)}
.scene .cloud{animation:drift 26s ease-in-out infinite alternate}
.scene .cloud.c2{animation-duration:34s; animation-delay:-12s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-14px)} to{transform:translateX(14px)}}
.bubble{position:relative; z-index:2; background:var(--card); border:3px solid var(--edge); border-radius:24px; padding:10px 20px; font-size:23px; font-weight:900; text-align:center; max-width:100%; box-shadow:0 4px 0 var(--edge-dark)}
.bubble::before{content:""; position:absolute; left:50%; bottom:-16px; margin-left:-10px; border:10px solid transparent; border-top-color:var(--edge); border-bottom:0}
.bubble::after{content:""; position:absolute; left:50%; bottom:-11px; margin-left:-7px; border:7px solid transparent; border-top-color:var(--card); border-bottom:0}
.buddy-btn{position:relative; z-index:1; padding:0; line-height:0; border-radius:50%; margin-bottom:-6px; animation:breathe 3.2s ease-in-out infinite alternate}
.buddy-btn .buddy-svg{width:205px; height:236px; max-width:100%; filter:drop-shadow(0 4px 3px rgba(40,30,10,.22))}
.buddy-btn .buddy-svg.hop{animation:hop 1.1s ease-out 2}
.nametag{position:absolute; z-index:2; left:16px; bottom:16px; font-size:16px; font-weight:900; background:var(--card); border:3px solid var(--edge); border-radius:999px; padding:2px 14px 2px 10px; display:flex; align-items:center; gap:6px; box-shadow:0 3px 0 var(--edge-dark)}
.nametag .ico{color:var(--paw)}
.buddy-svg .eyes{transform-box:fill-box; transform-origin:center; animation:blink 4.6s infinite}
.buddy-svg .tail{transform-box:fill-box; transform-origin:0% 100%; animation:wag 1.4s ease-in-out infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)} 95%{transform:scaleY(.08)}}
@keyframes wag{0%,100%{transform:rotate(0)} 50%{transform:rotate(16deg)}}
@keyframes breathe{from{transform:translateY(0) scale(1)} to{transform:translateY(-4px) scale(1.015)}}
@keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-20px) rotate(-3deg)}60%{transform:translateY(0)}80%{transform:translateY(-8px) rotate(3deg)}100%{transform:translateY(0)}}

.qcard{position:relative; background:var(--card); border:3px solid var(--edge); border-radius:28px; padding:28px 16px 18px; box-shadow:0 8px 0 var(--edge-dark); display:flex; flex-direction:column; gap:16px}
.ribbon{position:absolute; top:-16px; left:18px; background:var(--accent); color:var(--accent-fg); border:3px solid var(--accent-dark); font-size:15px; font-weight:900; padding:3px 14px; border-radius:999px; box-shadow:0 3px 0 var(--accent-dark); letter-spacing:.04em}
.qcard h1{font-size:30px; font-weight:900; text-align:center}
.choices{display:flex; flex-direction:column; gap:14px}
.choice{display:flex; align-items:center; gap:16px; min-height:88px; padding:8px 16px 8px 10px; font-size:28px; font-weight:900; text-align:left; width:100%}
.choice .pic{width:70px; height:70px; border-radius:50%; display:grid; place-items:center; font-size:42px; line-height:1; background:var(--p1); flex:0 0 auto; font-family:var(--font-body)}
.choice:nth-child(2) .pic{background:var(--p2)} .choice:nth-child(3) .pic{background:var(--p3)}
.choice.dunno{justify-content:center; font-size:25px; color:var(--muted); background:var(--p4); min-height:72px}

.rcard{position:relative; overflow:hidden; background:var(--card); border:3px solid var(--edge); border-radius:28px; padding:18px 16px 22px; box-shadow:0 8px 0 var(--edge-dark); text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px}
.rcard .hero{position:relative; width:200px; height:206px}
.rcard .hero svg{width:176px; height:202px; position:relative; z-index:1}
.rcard .hero .heart{position:absolute; bottom:40px; font-size:26px; line-height:1; animation:floatup 2.4s ease-out infinite; z-index:0; font-family:var(--font-body)}
.rcard .hero .heart:nth-child(2){left:4px; color:var(--accent)}
.rcard .hero .heart:nth-child(3){left:44px; color:var(--flower2); animation-delay:.5s; font-size:20px}
.rcard .hero .heart:nth-child(4){right:8px; color:var(--accent); animation-delay:.9s}
.rcard .hero .heart:nth-child(5){right:48px; color:var(--ok); animation-delay:1.4s; font-size:20px}
.rcard .hero .heart:nth-child(6){left:92px; color:var(--flower1); animation-delay:1.9s; font-size:18px}
@keyframes floatup{0%{transform:translateY(0) scale(.6); opacity:0} 15%{opacity:1} 100%{transform:translateY(-130px) scale(1.1); opacity:0}}
.stamp{display:inline-block; transform:rotate(-3deg); background:var(--accent); color:var(--accent-fg); border:3px solid var(--accent-dark); border-radius:20px; padding:8px 22px; font-size:30px; font-weight:900; line-height:1.3; box-shadow:0 5px 0 var(--accent-dark)}
.rcard .who{font-size:24px; font-weight:900}
.rcard .chip{display:inline-flex; align-items:center; gap:6px; background:var(--ok-bg); color:var(--ok); font-weight:900; font-size:21px; padding:6px 18px; border-radius:999px; border:3px solid var(--ok)}
.rcard .note{font-size:20px; color:var(--muted)}
.badge{display:flex; align-items:center; gap:10px; background:var(--card2); border:3px solid var(--edge); border-radius:999px; padding:6px 22px 6px 14px; font-size:24px; font-weight:900; font-variant-numeric:tabular-nums}
.badge b{font-size:44px; color:var(--accent); line-height:1}
.badge .ico{width:1.4em; height:1.4em; color:var(--flower2)}
.rcard .sent{display:flex; align-items:center; gap:8px; font-size:20px; color:var(--ok); font-weight:900}
.rcard .gift{background:var(--warn-bg); color:var(--warn); border:3px dashed var(--warn); border-radius:18px; padding:10px 16px; font-size:22px; font-weight:900; width:100%}
.rcard .bye{font-size:22px; color:var(--muted); margin-top:2px}

/* ===== 家族の画面 ===== */
.family{display:flex; flex-direction:column; gap:16px}
.fhead{position:relative; height:132px; border-radius:28px; overflow:hidden; border:4px solid var(--card); box-shadow:var(--shadow); background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom)); display:flex; align-items:flex-end; padding:14px 18px}
.fhead .hills{position:absolute; inset:0; width:100%; height:100%; z-index:0}
.fhead .txt{position:relative; z-index:1; display:flex; flex-direction:column; gap:2px}
.fhead .eyebrow{font-size:13px; font-weight:900; color:var(--family); background:var(--card); display:inline-block; align-self:flex-start; padding:1px 10px; border-radius:999px}
.fhead h2{font-size:25px; font-weight:900; color:var(--fg); text-shadow:0 2px 0 var(--card)}
.fhead .peek{position:absolute; right:10px; bottom:-28px; width:118px; height:136px; z-index:1; filter:drop-shadow(0 3px 2px rgba(40,30,10,.2))}
.fhead .peek svg{width:100%; height:100%}
.status{position:relative; border-radius:24px; padding:16px 18px 16px 20px; display:flex; flex-direction:column; gap:6px; border:3px solid; box-shadow:0 6px 0 var(--edge-dark)}
.status.ok{background:var(--ok-bg); border-color:var(--ok)} .status.ok .st{color:var(--ok)}
.status.warn{background:var(--warn-bg); border-color:var(--warn)} .status.warn .st{color:var(--warn)}
.status.bad{background:var(--bad-bg); border-color:var(--bad)} .status.bad .st{color:var(--bad)}
.status .st{display:flex; align-items:center; gap:8px; font-size:23px; font-weight:900; line-height:1.3}
.status .sub{font-family:var(--font-body); opacity:.9}
.status .sms{margin-top:6px; background:var(--card); border-radius:14px; padding:10px 12px; font-size:14px; color:var(--muted); font-family:var(--font-body)}
.status .sms b{color:var(--fg)}
.status .tel{font-size:24px; font-weight:900; font-variant-numeric:tabular-nums; user-select:all; display:flex; align-items:center; gap:8px}
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; background:var(--card); border:3px solid var(--edge); border-radius:22px; padding:10px 8px; box-shadow:0 6px 0 var(--edge-dark)}
.week .d{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12px; font-weight:700; color:var(--muted)}
.week .d.now{color:var(--family)}
.week .paw{width:32px; height:32px}
.week .paw.on{fill:var(--ok)} .week .paw.miss{fill:none; stroke:var(--bad); stroke-width:1.6} .week .paw.today{fill:none; stroke:var(--family); stroke-width:1.6; stroke-dasharray:2 2}
.row2{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.badge.small{font-size:20px; padding:4px 18px 4px 12px} .badge.small b{font-size:34px}
.btn{border-radius:18px; padding:12px 18px; font-weight:900; font-size:16px; display:inline-flex; align-items:center; gap:8px}
.block{background:var(--card); border:3px solid var(--edge); border-radius:26px; padding:20px 18px 18px; box-shadow:0 7px 0 var(--edge-dark); display:flex; flex-direction:column; gap:14px; position:relative}
.block h3{font-size:19px; font-weight:900; display:flex; align-items:center; gap:8px}
.block h3 .ico{color:var(--accent)}
.block .sub{color:var(--muted); font-size:14px; font-family:var(--font-body)}
.gifts{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.gift{position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; background:var(--card2); border:3px solid var(--edge); border-radius:20px; padding:16px 8px 10px; text-align:center; min-width:0}
.gift .tag{position:absolute; top:-12px; right:-6px; transform:rotate(8deg); background:var(--flower2); color:#3B2F2A; font-size:12px; font-weight:900; padding:2px 8px; border-radius:8px; border:2px solid #C9A227}
.gift svg{width:64px; height:74px}
.gift .nm{font-size:13px; font-weight:900; line-height:1.3}
.gift button{width:100%; border-radius:12px; padding:8px 4px; font-size:13px; font-weight:900; box-shadow:0 4px 0 var(--accent-dark)}
.gift button.sent{background:var(--warn-bg); color:var(--warn); border-color:var(--warn); box-shadow:none}
.gift button.worn{background:var(--ok-bg); color:var(--ok); border-color:var(--ok); box-shadow:none}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:13px; font-weight:900; color:var(--muted)}
.seg{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.seg button{border:3px solid var(--edge); border-radius:16px; padding:9px 4px; font-weight:900; font-size:15px; min-width:0; background:var(--card2); box-shadow:0 4px 0 var(--edge-dark)}
.seg button[aria-pressed="true"]{background:var(--family-bg); border-color:var(--family); color:var(--family); box-shadow:0 4px 0 var(--family-dark)}
input[type=text]{font:inherit; font-size:17px; font-weight:700; padding:10px 14px; border:3px solid var(--edge); border-radius:16px; background:var(--card2); color:var(--fg); width:100%}
.smsbox{background:var(--family-bg); border:3px solid var(--family); border-radius:18px; padding:12px 14px; font-size:15px; display:flex; flex-direction:column; gap:6px; font-family:var(--font-body)}
.smsbox .from{font-size:12px; color:var(--muted)}
.toast{position:fixed; z-index:20; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:10px 20px; border-radius:999px; font-weight:900; font-size:15px; box-shadow:var(--shadow); max-width:calc(100% - 32px); text-align:center}
.vis{position:absolute; left:-9999px; top:0}
@media (prefers-reduced-motion: reduce){.hop,.buddy-btn,.buddy-svg .eyes,.buddy-svg .tail,.rcard .hero .heart,.scene .rays,.scene .cloud{animation:none !important} .rcard .hero .heart{opacity:.9} .toy:active{transform:none}}
</style>

<script>
(function(){

    dog:{name:'ポチ', svg:

      '<path class="tail" d="M124 156 Q164 146 154 110" stroke="#D9D2C7" stroke-width="11" fill="none" stroke-linecap="round"/>'+

      '<path d="M40 58 L32 12 L68 36 Z" fill="#D9D2C7"/><path d="M120 58 L128 12 L92 36 Z" fill="#D9D2C7"/><path d="M44 50 L39 24 L60 38 Z" fill="#F2A39A"/><path d="M116 50 L121 24 L100 38 Z" fill="#F2A39A"/>'+
      '<circle cx="80" cy="82" r="46" fill="#D9D2C7"/>'+
      '<g class="eyes"><ellipse cx="64" cy="78" rx="6" ry="7.5" fill="#2A2520"/><ellipse cx="96" cy="78" rx="6" ry="7.5" fill="#2A2520"/><circle cx="66.5" cy="75" r="2.4" fill="#fff"/><circle cx="98.5" cy="75" r="2.4" fill="#fff"/></g>'+
      '<path d="M75 92 L85 92 L80 98 Z" fill="#E88A9A"/><path d="M80 98 Q72 108 64 103 M80 98 Q88 108 96 103" stroke="#3A2A20" stroke-width="2.8" fill="none" stroke-linecap="round"/>'+
      '<path d="M28 86 L54 90 M28 98 L54 94 M132 86 L106 90 M132 98 L106 94" stroke="#8C847A" stroke-width="2.2" stroke-linecap="round"/>'+
      '<circle cx="52" cy="98" r="7" fill="#F2A39A" opacity=".55"/><circle cx="108" cy="98" r="7" fill="#F2A39A" opacity=".55"/>'},
    panda:{name:'パン', svg:
      '<ellipse cx="80" cy="146" rx="48" ry="33" fill="#FFFFFF" stroke="#D4CEC4" stroke-width="2"/>'+
      '<ellipse cx="40" cy="142" rx="15" ry="22" fill="#2A2520" transform="rotate(20 40 142)"/><ellipse cx="120" cy="142" rx="15" ry="22" fill="#2A2520" transform="rotate(-20 120 142)"/>'+
      '<ellipse cx="56" cy="172" rx="17" ry="10" fill="#2A2520"/><ellipse cx="104" cy="172" rx="17" ry="10" fill="#2A2520"/>'+
      '<circle cx="44" cy="44" r="17" fill="#2A2520"/><circle cx="116" cy="44" r="17" fill="#2A2520"/>'+
      '<circle cx="80" cy="82" r="46" fill="#FFFFFF" stroke="#D4CEC4" stroke-width="2"/>'+
      '<ellipse cx="63" cy="78" rx="12.5" ry="15" fill="#2A2520" transform="rotate(-15 63 78)"/><ellipse cx="97" cy="78" rx="12.5" ry="15" fill="#2A2520" transform="rotate(15 97 78)"/>'+
      '<g class="eyes"><circle cx="64" cy="78" r="5" fill="#fff"/><circle cx="96" cy="78" r="5" fill="#fff"/><circle cx="65" cy="77" r="2" fill="#2A2520"/><circle cx="97" cy="77" r="2" fill="#2A2520"/></g>'+
      '<ellipse cx="80" cy="96" rx="7" ry="5" fill="#2A2520"/><path d="M70 105 Q80 113 90 105" stroke="#2A2520" stroke-width="3.5" fill="none" stroke-linecap="round"/>'+
      '<circle cx="50" cy="100" r="7" fill="#F2A39A" opacity=".55"/><circle cx="110" cy="100" r="7" fill="#F2A39A" opacity=".55"/>'}
  };
  var ITEMS={
    hat:{name:'あかい ぼうし', svg:'<path d="M38 60 Q80 -4 122 60 Z" fill="#D9471F"/><rect x="33" y="54" width="94" height="13" rx="6.5" fill="#F7F4EC" stroke="#D9471F" stroke-width="2.5"/><circle cx="80" cy="12" r="10" fill="#F7F4EC" stroke="#D9471F" stroke-width="2.5"/>'},
    scarf:{name:'みどりの マフラー', svg:'<rect x="36" y="114" width="88" height="17" rx="8.5" fill="#2F8F6E"/><rect x="94" y="124" width="17" height="28" rx="7" fill="#2F8F6E"/><path d="M42 122 H116" stroke="#F7F4EC" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"/>'},
    ribbon:{name:'ピンクの リボン', svg:'<path d="M112 40 L138 22 L138 58 Z" fill="#E05C8A"/><path d="M112 40 L86 22 L86 58 Z" fill="#E05C8A"/><circle cx="112" cy="40" r="7.5" fill="#F7F4EC" stroke="#E05C8A" stroke-width="2.5"/>'}
  };
  function buddySVG(animal, worn, cls){
    var s='<svg viewBox="0 0 160 184" xmlns="http://www.w3.org/2000/svg" class="buddy-svg '+(cls||'')+'" aria-hidden="true">'+ANIMALS[animal].svg;
    (worn||[]).forEach(function(id){ if(ITEMS[id]) s+=ITEMS[id].svg; });
    return s+'</svg>';
  }
  function itemSVG(id){
    return '<svg viewBox="0 0 160 184" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="80" cy="82" r="46" fill="none" stroke="var(--edge-dark)" stroke-width="2.5" stroke-dasharray="5 6"/><ellipse cx="80" cy="146" rx="48" ry="33" fill="none" stroke="var(--edge-dark)" stroke-width="2.5" stroke-dasharray="5 6"/>'+ITEMS[id].svg+'</svg>';
  }
  function ico(id){ return '<svg class="ico" aria-hidden="true"><use href="#'+id+'"/></svg>'; }

  // ---------- きょうの1問 ----------
  var WD=['にち','げつ','か','すい','もく','きん','ど'];
  var Q=[
    {q:'りんごは どれ？', c:[['🍎','りんご'],['🍌','バナナ'],['🍇','ぶどう']]},
    {q:'いぬは どれ？', c:[['🐶','いぬ'],['🐱','ねこ'],['🐼','パンダ']]},
    {q:'あかい ものは どれ？', c:[['🍅','トマト'],['🍋','レモン'],['🥦','ブロッコリー']]},
    {q:'いちばん おおきい どうぶつは？', c:[['🐘','ぞう'],['🐭','ねずみ'],['🐜','あり']]},
    {q:'よるの そらに でるのは？', c:[['🌙','つき'],['☀️','たいよう'],['🌈','にじ']]},
    {q:'はるに さく はなは？', c:[['🌸','さくら'],['🍁','もみじ'],['🎃','かぼちゃ']]},
    {q:'あついのは どれ？', c:[['☕','おちゃ'],['🍧','かきごおり'],['🧊','こおり']]},
    {q:'そらを とぶのは どれ？', c:[['🐦','とり'],['🐟','さかな'],['🐢','かめ']]}
  ];
  function questionFor(date){
    var idx=Math.floor(date.getTime()/DAY);
    if(idx%4===0){
      var w=date.getDay();
      var ch=[[ '📅', WD[w]+'ようび'],['📅',WD[(w+2)%7]+'ようび'],['📅',WD[(w+4)%7]+'ようび']];
      return rot({q:'きょうは なんようび？', c:ch}, idx);
    }
    var base=Q[idx%Q.length];
    return rot({q:base.q, c:base.c.slice()}, idx);
  }
  function rot(qq, idx){ // 正解が毎日ちがう位置に来るように回す
    var k=idx%3, c=qq.c, out=[];
    for(var i=0;i<3;i++) out.push(c[(i+k)%3]);
    return {q:qq.q, c:out, a:(3-k)%3};
  }

  // ---------- 状態 ----------
  var S;
  function key(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function pad(n){ return (n<10?'0':'')+n; }
  function today(){ var d=new Date(); d.setHours(12,0,0,0); return new Date(d.getTime()+S.dayOffset*DAY); }
  function daysAgo(n){ return new Date(today().getTime()-n*DAY); }
  function fresh(){
    var s={dayOffset:0, settings:{parentName:'ふみこ', familyName:'ゆか', relation:'むすめ', animal:'dog', alertAfter:2, timeOfDay:'あさ', contact:'SMS', phone:'090-1234-5678'}, answers:{}, gifts:[], worn:[]};
    S=s;
    var times=['8:12','7:55','8:40','9:03','8:21','8:08','7:48','8:33','8:15','9:10','8:02'];
    for(var i=1;i<=11;i++){ s.answers[key(daysAgo(i))]={pick:0, correct:i%5!==0, time:times[i-1], label:''}; }
    return s;
  }
  function load(){
    try{ var raw=localStorage.getItem(KEY); if(raw){ S=JSON.parse(raw); if(S&&S.settings&&S.answers) return; } }catch(e){}
    fresh();
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  function streak(){
    var n=0, start=S.answers[key(today())]?0:1;
    for(var i=start;i<400;i++){ if(S.answers[key(daysAgo(i))]) n++; else break; }
    return n;
  }
  function missedBeforeToday(){
    var n=0;
    for(var i=1;i<400;i++){ if(S.answers[key(daysAgo(i))]) break; n++; }
    return n;
  }
  function greeting(){
    var h=new Date().getHours();
    return h<11?'おはよう':(h<17?'こんにちは':'こんばんは');
  }
  function pendingGift(){ // きのう以前に贈られて、まだ着ていないもの
    var t=key(today());
    for(var i=0;i<S.gifts.length;i++){ var g=S.gifts[i]; if(g.day<t && S.worn.indexOf(g.id)<0) return g; }
    return null;
  }

  // ---------- 親の画面 ----------
  var el=function(id){ return document.getElementById(id); };
  var PET=['なでなで うれしい！','えへへ','きょうも いっしょだね','だいすき！','ふふっ'];
  var petTimer;
  el('p-buddy').addEventListener('click', function(){
    var svg=this.querySelector('svg'); if(!svg) return;
    svg.classList.remove('hop'); void svg.offsetWidth; svg.classList.add('hop');
    var b=el('p-bubble'), keep=b.getAttribute('data-base')||b.textContent;
    b.setAttribute('data-base', keep);
    b.textContent=PET[Math.floor(Math.random()*PET.length)];
    clearTimeout(petTimer); petTimer=setTimeout(function(){ b.textContent=b.getAttribute('data-base')||keep; }, 1800);
  });
  function renderParent(){
    var st=S.settings, an=ANIMALS[st.animal], t=key(today()), done=S.answers[t];
    el('p-buddy').innerHTML=buddySVG(st.animal, S.worn);
    el('p-name').textContent=an.name;
    var missed=missedBeforeToday();
    var line=done?('また あした！'):(missed>0?(st.parentName+'さん、まってたよ！'):(greeting()+'、'+st.parentName+'さん'));
    clearTimeout(petTimer);
    el('p-bubble').textContent=line; el('p-bubble').setAttribute('data-base', line);
    el('p-qcard').hidden=!!done;
    el('p-result').hidden=!done;
    if(done){ renderResult(done); return; }
    var qq=questionFor(today());
    el('p-question').textContent=qq.q;
    var box=el('p-choices'); box.innerHTML='';
    qq.c.forEach(function(c,i){
      var b=document.createElement('button'); b.className='choice toy'; b.type='button'; b.id='choice-'+i;
      b.innerHTML='<span class="pic">'+c[0]+'</span><span>'+c[1]+'</span>';
      b.addEventListener('click', function(){ answer(i, qq); });
      box.appendChild(b);
    });
    var d=document.createElement('button'); d.className='choice toy dunno'; d.type='button'; d.id='choice-dunno'; d.textContent='わからない';
    d.addEventListener('click', function(){ answer(-1, qq); });
    box.appendChild(d);
  }
  function answer(i, qq){
    var now=new Date();
    var rec={pick:i, correct:i===qq.a, time:now.getHours()+':'+pad(now.getMinutes()), label:i<0?'わからない':qq.c[i][1], ans:qq.c[qq.a][1]};
    S.answers[key(today())]=rec;
    var g=pendingGift();
    if(g){ S.worn.push(g.id); rec.gift=g.id; }
    save(); renderParent(); renderFamily();
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function renderResult(rec){
    var st=S.settings, r=el('p-result');
    var h='<div class="hero">'+buddySVG(st.animal, S.worn, 'hop')+'<span class="heart">♥</span><span class="heart">✦</span><span class="heart">♥</span><span class="heart">✦</span><span class="heart">♥</span></div>';
    h+='<div class="who">'+st.parentName+'さん</div><div class="stamp">きょうも 元気！</div>';
    if(rec.pick>=0){ h+= rec.correct?'<div class="chip">'+ico('i-check')+'せいかい！</div>':'<div class="note">こたえは「'+rec.ans+'」でした</div>'; }
    else if(rec.ans){ h+='<div class="note">こたえは「'+rec.ans+'」でした</div>'; }
    h+='<div class="badge">'+ico('i-crown')+'つづけて <b>'+streak()+'</b> 日</div>';
    if(rec.gift){ h+='<div class="gift">'+st.relation+'の '+st.familyName+'さんから<br>「'+ITEMS[rec.gift].name+'」が とどきました！</div>'; }
    h+='<div class="sent">'+ico('i-mail')+st.relation+'の '+st.familyName+'さんに とどけました</div>';
    h+='<div class="bye">また あした。</div>';
    r.innerHTML=h;
  }

  // ---------- 家族の画面 ----------
  function renderFamily(){
    var st=S.settings, t=key(today()), done=S.answers[t], missed=missedBeforeToday(), an=ANIMALS[st.animal];
    el('f-title').textContent=st.parentName+'さんの きょう';
    el('f-buddy').innerHTML=buddySVG(st.animal, S.worn);
    var s=el('f-status'), h='';
    if(done){
      s.className='status ok';
      h='<div class="st">'+ico('i-check')+'きょう '+done.time+' に 答えました</div>';
      h+='<div class="sub">きょうの答え：'+(done.pick<0?'わからない':done.label+(done.correct?'（せいかい）':'（こたえは '+done.ans+'）'))+'</div>';
      if(done.gift) h+='<div class="sub">「'+ITEMS[done.gift].name+'」を受け取りました</div>';
      h+='<div class="sms">'+st.contact+'で届いた知らせ<br><b>【ワンポチ】'+st.parentName+'さん、きょうも元気です（'+done.time+'）</b></div>';
    }else if(missed>=st.alertAfter){
      s.className='status bad';
      h='<div class="st">'+ico('i-bell')+st.parentName+'さんが '+missed+'日 答えていません</div>';
      h+='<div class="sub">電話してみてください</div><div class="tel">'+ico('i-phone')+st.phone+'</div>';
      h+='<div class="sms">'+st.contact+'で届いた知らせ（例）<br><b>【ワンポチ】'+st.parentName+'さんが'+missed+'日答えていません。電話してみてください。</b></div>';
    }else{
      s.className='status warn';
      h='<div class="st">'+ico('i-clock')+'きょうは まだ です</div>';
      h+='<div class="sub">'+(missed>0?('きのうも答えていません。'+(st.alertAfter-missed)+'日 続くと知らせが届きます。'):(an.name+'が '+st.timeOfDay+'に「まってるよ」と声をかけます。答えがなければ昼と夕方にもう一度。'))+'</div>';
    }
    s.innerHTML=h;

    var w=el('f-week'); w.innerHTML='';
    for(var i=6;i>=0;i--){
      var d=daysAgo(i), k=key(d), rec=S.answers[k];
      var div=document.createElement('div'); div.className='d'+(i===0?' now':'');
      var cls=rec?'on':(i===0?'today':'miss');
      div.innerHTML='<span>'+WD[d.getDay()]+'</span><svg class="paw '+cls+'" aria-hidden="true"><use href="#i-paw"/></svg>';
      w.appendChild(div);
    }
    el('f-streak').innerHTML=ico('i-crown')+'つづけて <b>'+streak()+'</b> 日';

    var g=el('f-gifts'); g.innerHTML='';
    Object.keys(ITEMS).forEach(function(id){
      var worn=S.worn.indexOf(id)>=0, sent=S.gifts.some(function(x){ return x.id===id; });
      var card=document.createElement('div'); card.className='gift';
      card.innerHTML='<span class="tag">¥100</span>'+itemSVG(id)+'<div class="nm">'+ITEMS[id].name+'</div>';
      var b=document.createElement('button'); b.type='button'; b.id='gift-'+id; b.className='toy accent';
      if(worn){ b.className='toy worn'; b.textContent='着ています'; b.disabled=true; }
      else if(sent){ b.className='toy sent'; b.textContent='あす朝とどく'; b.disabled=true; }
      else { b.textContent='贈る'; b.addEventListener('click', function(){ S.gifts.push({id:id, day:key(today())}); save(); renderFamily(); toast('あす朝、'+st.parentName+'さんの画面にとどきます'); }); }
      card.appendChild(b); g.appendChild(card);
    });

    el('s-parent').value=st.parentName; el('s-family').value=st.familyName; el('s-phone').value=st.phone;
    seg('s-relation',['むすめ','むすこ','まご'],st.relation,function(v){ st.relation=v; });
    seg('s-animal',['dog','cat','panda'],st.animal,function(v){ st.animal=v; },function(v){ return ANIMALS[v].name; });
    seg('s-alert',[1,2,3],st.alertAfter,function(v){ st.alertAfter=v; },function(v){ return ['次の日','2日後','3日後'][v-1]; });
    seg('s-time',['あさ','ひる','よる'],st.timeOfDay,function(v){ st.timeOfDay=v; });
    seg('s-contact',['SMS','LINE','アプリ通知'],st.contact,function(v){ st.contact=v; });
  }
  function seg(id, vals, cur, set, label){
    var box=el(id); box.innerHTML='';
    vals.forEach(function(v){
      var b=document.createElement('button'); b.type='button'; b.id=id+'-'+v;
      b.textContent=label?label(v):v; b.setAttribute('aria-pressed', v===cur?'true':'false');
      b.addEventListener('click', function(){ set(v); save(); renderAll(); });
      box.appendChild(b);
    });
  }
  el('s-parent').addEventListener('change', function(){ S.settings.parentName=this.value.trim()||'おや'; save(); renderAll(); });
  el('s-family').addEventListener('change', function(){ S.settings.familyName=this.value.trim()||'かぞく'; save(); renderAll(); });
  el('s-phone').addEventListener('change', function(){ S.settings.phone=this.value.trim(); save(); renderAll(); });
  el('f-send').addEventListener('click', function(){
    var st=S.settings, b=el('f-sms');
    b.hidden=false;
    b.innerHTML='<div class="from">'+st.parentName+'さんのスマホに届くSMS（例）</div><div>'+st.familyName+'です。これを押すと「'+ANIMALS[st.animal].name+'」が毎'+st.timeOfDay+'あいさつに来ます。押すだけでいいよ。<br><b>wanpochi.app/f/8k2m</b></div><div class="from">リンクを押した瞬間に親の画面になります。名前・相棒・時間はここで決めた通り。親側の登録・コード入力はありません。帰省したときはこのQRを目の前で読ませてもOK。</div>';
    toast('送りました（試作のため実際には送られません）');
  });
  el('f-share').addEventListener('click', function(){
    var st=S.settings, text=st.parentName+'、きょうも元気。ワンポチ '+streak()+'日つづいてます #ワンポチ';
    function fallback(){ var ta=el('clip'); ta.value=text; ta.select(); try{ document.execCommand('copy'); }catch(e){} toast('コピーしました：'+text); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ toast('コピーしました：'+text); }, fallback); } else fallback();
  });

  // ---------- 試作メニュー ----------
  function show(v){
    el('parent').hidden=v!=='parent'; el('family').hidden=v!=='family';
    el('d-parent').setAttribute('aria-pressed', v==='parent'?'true':'false');
    el('d-family').setAttribute('aria-pressed', v==='family'?'true':'false');
    try{ localStorage.setItem(KEY+'_view', v); }catch(e){}
  }
  el('d-parent').addEventListener('click', function(){ show('parent'); });
  el('d-family').addEventListener('click', function(){ show('family'); });
  el('d-next').addEventListener('click', function(){ S.dayOffset++; save(); renderAll(); toast('1日すすめました'); });
  el('d-reset').addEventListener('click', function(){ fresh(); save(); renderAll(); show('parent'); toast('はじめに戻しました'); });

  var toastTimer;
  function toast(msg){ var t=el('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.hidden=true; }, 2600); }

  function renderAll(){
    var d=today();
    el('d-day').textContent=(S.dayOffset===0?'きょう':'+'+S.dayOffset+'日')+'（'+(d.getMonth()+1)+'/'+d.getDate()+' '+WD[d.getDay()]+'）';
    renderParent(); renderFamily();
  }
  load(); renderAll();
  var v='parent'; try{ v=localStorage.getItem(KEY+'_view')||'parent'; }catch(e){}
  show(v);
})();
</script>

</body></html>
