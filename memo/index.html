<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<link rel="manifest" href="/memo/manifest.json">
<link rel="icon" href="/memo/icon-192.png">
<link rel="apple-touch-icon" href="/memo/icon-192.png">
<title>夜メモ</title>
<style>
  :root{--bg:#0b0a09;--fg:#d9cdb8;--dim:#6f6558;--amber:#e8c98a;--line:rgba(232,201,138,.18)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 16px 40px}
  h1{font-size:15px;font-weight:600;letter-spacing:.12em;color:var(--amber);margin:6px 0 2px;display:flex;align-items:center;gap:10px}
  .sub{font-size:12px;color:var(--dim);margin-bottom:14px}
  /* 聞いてる印：点がゆっくり呼吸する。夜はこれと件数しか出さへん */
  .ear{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px 0 8px;cursor:pointer}
  .dot{width:72px;height:72px;border-radius:50%;border:2px solid var(--amber);display:flex;align-items:center;justify-content:center;transition:transform .4s,background .4s}
  .dot i{width:22px;height:22px;border-radius:50%;background:var(--amber);opacity:.35}
  .ear.on .dot{animation:breath 2.6s ease-in-out infinite}
  .ear.on .dot i{opacity:1}
  .ear.hear .dot{background:rgba(232,201,138,.18);transform:scale(1.08)}
  .ear.off .dot{border-color:var(--dim)}
  .ear.off .dot i{background:var(--dim)}
  @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .earTxt{font-size:14px;color:var(--amber);min-height:1.4em;text-align:center}
  .interim{font-size:13px;color:var(--dim);min-height:1.4em;text-align:center;max-width:90vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .night{margin-top:12vh;text-align:center}
  .night .big{font-size:20px;color:var(--amber);margin-bottom:8px}
  .night .n{font-size:13px;color:var(--dim)}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  li .t{flex:1;font-size:16px;line-height:1.55;word-break:break-word}
  li .when{font-size:11px;color:var(--dim);margin-top:4px}
  li.done .t{color:var(--dim);text-decoration:line-through}
  button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--amber);border-radius:999px;padding:8px 14px;font-size:13px;font-family:inherit}
  button.sm{padding:6px 10px;font-size:12px;color:var(--dim)}
  button.sm.on{color:var(--amber)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
  .row{display:flex;gap:8px;margin-top:18px}
  input[type=text]{flex:1;background:#141210;border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:11px 12px;font-size:15px;font-family:inherit}
  .empty{color:var(--dim);font-size:14px;padding:18px 0}
  .exp{margin-top:26px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cloud{font-size:11px;color:var(--dim);font-weight:400;letter-spacing:0}
  .cloud.ok{color:#8fbf9a}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(20,16,12,.9);color:var(--amber);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast.on{opacity:1}
</style>
</head>
<body>
<h1>夜メモ <span class="cloud" id="cloud"></span></h1>
<div class="sub" id="sub"></div>
<div class="ear" id="ear"><div class="dot"><i></i></div><div class="earTxt" id="earTxt">…</div><div class="interim" id="interim"></div></div>
<div id="main"></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
  // しくみ
  //  ・開いたら勝手にマイクが立つ（Chromeの音声認識）。喋ったら文字になって、ひと息ついたら保存。ボタンは要らん。
  //  ・保存先は2つ：この端末（localStorage "tokie_memo_v1"。トキエで「メモしといて」と言うた分も同じ場所）＋ クラウド（/api/memo）。
  //    クラウドがつながってたら、毎朝8時前にClaudeが /api/memo を読んで並べる。つながってへん間は端末だけで動く。
  //  ・夜（22時〜8時）は中身を見せへん。件数と「聞いてる」の印だけ。読み返すと頭が回り出すから。
  const KEY="tokie_memo_v1", PEEK="tokie_memo_peek_v1", API="/api/memo", API_KEY="yorumemo-7a3k9q2v";
  const OPEN_H=8, CLOSE_H=22;
  const $=(id)=>document.getElementById(id);
  const main=$("main"), sub=$("sub"), ear=$("ear"), earTxt=$("earTxt"), interimEl=$("interim"), cloudEl=$("cloud");
  function all(){try{const a=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(a)?a:[];}catch(e){return [];}}
  function save(a){try{localStorage.setItem(KEY,JSON.stringify(a.slice(-500)));}catch(e){}}
  function peek(){return localStorage.getItem(PEEK)==="1";}
  function isDay(){const h=new Date().getHours();return h>=OPEN_H&&h<CLOSE_H;}
  function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function when(ts){const d=new Date(ts);return (d.getMonth()+1)+"/"+d.getDate()+" "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");}
  function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),2000);}
  function copyText(t){
    if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).then(()=>toast("コピーした"),()=>toast("コピーでけへんかった"));
    const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("コピーした");}catch(e){toast("コピーでけへんかった");}ta.remove();
  }

  // ── クラウド ─────────────────────────────
  let cloud=null; // null=未確認 / true / false
  async function api(body){
    const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({k:API_KEY},body))});
    const j=await r.json().catch(()=>({ok:false}));
    cloud=!!(j.cloud);renderCloud();
    return j;
  }
  function renderCloud(){cloudEl.textContent=cloud===null?"":(cloud?"☁ つながってる":"端末だけ（クラウド未接続）");cloudEl.className="cloud"+(cloud?" ok":"");}
  async function syncCloud(){ // 端末の分を全部クラウドへ（同じidは向こうで飛ばす）、クラウドの分を端末へ
    try{
      const j=await api({op:"sync",memos:all().filter(x=>!x.done)});
      if(!j.ok)return;
      const a=all();const ids=new Set(a.map(x=>x.id));let n=0;
      for(const m of (j.memos||[])){if(!ids.has(m.id)){a.push({id:m.id,ts:m.ts,text:m.text,done:false,from:m.from});n++;}}
      if(n){save(a);render();}
    }catch(e){cloud=false;renderCloud();}
  }
  function pushOne(x){api({op:"add",id:x.id,ts:x.ts,text:x.text,from:x.from}).catch(()=>{});}

  // ── 保存 ─────────────────────────────
  function addMemo(text,from){
    const t=String(text||"").replace(/\s+/g," ").trim();if(t.length<2)return null;
    const a=all();const x={id:String(Date.now())+Math.random().toString(36).slice(2,6),ts:Date.now(),text:t,done:false,from:from||"web"};
    a.push(x);save(a);pushOne(x);render();
    try{navigator.vibrate&&navigator.vibrate(30);}catch(e){}
    return x;
  }

  // ── 耳（開いたら勝手に聞く）──────────────
  // v3: 書き起こしは ElevenLabs Scribe（トキエの聞き取りと同じ会社の耳。速い・日本語が強い）。
  //   マイクの音を録って、間（2.2秒の静けさ）で1かたまりに区切り → Scribe に送る → 口ぐせ（えー・あの・とか…）を落として保存。
  //   10秒以内に続きを喋ったら、前のメモの続きとしてつなぐ（文の途中で切れても1件にまとまる）。
  //   ElevenLabsのAPIキーはこのブラウザに1回だけ入れる（tokie_memo_el_key）。
  const SILENCE_MS=2200, MIN_SPEECH_MS=600, MAX_SEG_MS=60000, THRESH=0.012, JOIN_MS=12000;
  const EL_MODELS=["scribe_v2","scribe_v1"];
  function elKey(){try{return (localStorage.getItem("tokie_memo_el_key")||"").replace(/\s+/g,"");}catch(e){return "";}}
  let stream=null, ac=null, analyser=null, recorder=null, chunks=[], wantEar=true, vadT=null;
  let floor=0.004, thr=0.012; // 部屋の音（テレビ・音楽）の大きさを覚えて、それより一段大きい声だけを「喋った」とみなす
  let talking=false, talkStart=0, lastLoud=0, segStart=0, busy=0, pendingBlob=null, lastMemoId=null, lastMemoAt=0;
  function earState(cls,txt){ear.className="ear "+cls;earTxt.textContent=txt;}
  function mime(){for(const m of ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"]){try{if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;}catch(e){}}return "";}
  async function earStart(){
    if(stream)return;
    if(!elKey()){earState("off","ElevenLabsのAPIキーを1回だけ入れて");renderKeyBox(true);return;}
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    }catch(e){earState("off",(e&&e.name==="NotAllowedError")?"ここをタップしてマイクを許可":"マイクが使えへん："+String(e&&e.message||e));return;}
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaStreamSource(stream);analyser=ac.createAnalyser();analyser.fftSize=1024;src.connect(analyser);
    startRecorder();
    earState("on","聞いてるで。喋ったら勝手にメモする");
    const buf=new Float32Array(analyser.fftSize);
    vadT=setInterval(()=>{
      if(!analyser)return;
      analyser.getFloatTimeDomainData(buf);let sum=0;for(let i=0;i<buf.length;i++)sum+=buf[i]*buf[i];const rms=Math.sqrt(sum/buf.length);
      const now=Date.now();
      floor+=(rms-floor)*(rms<floor?0.2:0.008); thr=Math.max(THRESH,floor*2.2); // 下がる時は速く、上がる時はゆっくり（ずっと鳴ってる音＝部屋の音として覚える）
      if(rms>thr){lastLoud=now;if(!talking){talking=true;talkStart=now;ear.classList.add("hear");interimEl.textContent="…";}}
      if(talking&&now-lastLoud>SILENCE_MS){
        talking=false;ear.classList.remove("hear");
        cutSegment(lastLoud-talkStart>=MIN_SPEECH_MS);
      }else if(talking&&now-segStart>MAX_SEG_MS){cutSegment(true);talkStart=now;}
    },100);
  }
  function startRecorder(){
    chunks=[];const m=mime();
    try{recorder=new MediaRecorder(stream,m?{mimeType:m}:undefined);}catch(e){recorder=new MediaRecorder(stream);}
    recorder.ondataavailable=(e)=>{if(e.data&&e.data.size)chunks.push(e.data);};
    recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType||m||"audio/webm"});chunks=[];const keep=pendingBlob;pendingBlob=null;if(keep&&blob.size>2000)transcribe(blob);if(stream&&wantEar)startRecorder();};
    recorder.start();segStart=Date.now();
  }
  function cutSegment(keep){if(!recorder||recorder.state!=="recording")return;pendingBlob=keep;try{recorder.stop();}catch(e){}}
  function earStop(){
    wantEar=false;clearInterval(vadT);vadT=null;
    try{if(recorder&&recorder.state==="recording"){pendingBlob=false;recorder.stop();}}catch(e){}recorder=null;
    try{stream&&stream.getTracks().forEach(t=>t.stop());}catch(e){}stream=null;
    try{ac&&ac.close();}catch(e){}ac=null;analyser=null;talking=false;ear.classList.remove("hear");
    earState("off","止めてる（タップで再開）");
  }
  // 口ぐせ・つなぎ言葉を落とす（文の中身は触らへん）
  const FILLER_RE=/(?:^|(?<=[\s、。，,・…]))(?:えーっと|えーと|えっとね|えっと|えっ|ええと|えー+|えぇ|あのー+|あのね|あの|あのさ|なんか|なんかね|まあ|まぁ|うーん|うん|んー+|ん|そのー+|その|とか|っていうのも|っていうか|ていうか|てか|やっぱ|やっぱり|ほら|なんていうか|なんだろう|ね|ねえ|ねぇ)(?=$|[\s、。，,・…])/g;
  function cleanText(t){
    let s=String(t||"").replace(/\r?\n+/g," ").replace(/\s+/g," ").trim();
    for(let i=0;i<3;i++)s=s.replace(FILLER_RE," ");
    s=s.replace(/(?:とか[、,]?\s*){2,}/g,"").replace(/(?:えー?[、,]?\s*){2,}/g,"");
    s=s.replace(/(\S{3,15})(?:[、,]?\s*\1)+/g,"$1"); // 同じ言葉（3文字以上）の繰り返しは1回に
    s=s.replace(/\s*([、。，,・！？!?])\s*/g,"$1").replace(/^[、。，,・…\s]+|[、，,・…\s]+$/g,"").replace(/、{2,}/g,"、").replace(/\s+/g," ").trim();
    return s;
  }
  function meaningful(s){return s.replace(/[\s、。，,・…！？!?]/g,"").length>=3;}
  async function transcribe(blob){
    busy++;earTxt.textContent="書き起こし中…";
    try{
      const key=elKey();let text="",lastErr="";
      for(const m of EL_MODELS){
        const fd=new FormData();fd.append("model_id",m);fd.append("file",blob,"memo."+((blob.type||"audio/webm").includes("mp4")?"m4a":"webm"));
        fd.append("language_code","ja");fd.append("tag_audio_events","false");fd.append("diarize","false");
        try{
          const r=await fetch("https://api.elevenlabs.io/v1/speech-to-text",{method:"POST",headers:{"xi-api-key":key},body:fd});
          const j=await r.json().catch(()=>({}));
          if(!r.ok){lastErr=(j&&j.detail&&(j.detail.message||j.detail.status||JSON.stringify(j.detail)))||("HTTP "+r.status);if(r.status===401){showErr(/permission|speech_to_text/i.test(lastErr)?"この鍵は「Speech to Text」が No Access になってる。ElevenLabsの鍵の設定で Speech to Text を Access にして、このページを開き直して。":"鍵が違う（"+lastErr+"）。下の欄に入れ直して。");renderKeyBox(true);return;}continue;}
          text=String(j.text||"").trim();break;
        }catch(e){lastErr=String(e&&e.message||e);}
      }
      if(!text){if(lastErr)showErr("書き起こしでけへん："+lastErr);return;}
      showErr("");
      const s=cleanText(text);
      if(!meaningful(s))return;
      if(!(await isMyMemo(s))){rejectAdd(s);return;}
      const now=Date.now();
      if(lastMemoId&&now-lastMemoAt<JOIN_MS){ // 続きの一言 → 前のメモにつなぐ
        const a=all();const x=a.find(y=>y.id===lastMemoId&&!y.done);
        if(x){x.text=(x.text.replace(/[、，,\s]+$/,"")+(/[。！？!?]$/.test(x.text)?"":"、")+s).replace(/、+/g,"、");save(a);pushOne(x);render();lastMemoAt=now;toast("続きをつないだ");return;}
      }
      const x=addMemo(s,"ear");if(x){lastMemoId=x.id;lastMemoAt=now;toast("メモした（"+openCount()+"件）");}
    }finally{busy--;if(stream&&!busy)earTxt.textContent="聞いてるで。喋ったら勝手にメモする";interimEl.textContent="";}
  }
  // テレビ・音楽・他人の話を弾く（トキエと同じGeminiのキーを使う。キーが無い時・判定でけへん時は残す）
  const J_MODELS=["gemini-3.8-flash","gemini-flash-latest","gemini-2.5-flash","gemini-4-argon"];
  function gKey(){try{return (localStorage.getItem("tokie_gemini_key_v1")||"").trim();}catch(e){return "";}}
  const JUDGE="次の文は、スマホのメモアプリのマイクが拾った音声の書き起こしです。持ち主（40歳前後の男性。アプリ開発・行政書士・社労士・不動産・音楽・選挙などに関わる）が自分用に吹き込んだ「メモ・思いつき・やること・アイデア・独り言」なら MEMO、"+
    "テレビ番組・ニュース・CM・ドラマのセリフ・歌詞・ラジオ・動画・周りの他人の会話など、持ち主のメモではない音なら NOISE と答えてください。"+
    "判断の目安：「〜すること」「〜したい」「明日〜」「〜を作る」「〜を直す」など自分の行動・計画・アイデアは MEMO。第三者への語りかけ、番組の進行、ニュース原稿口調、物語のセリフ、歌詞、脈絡のない断片は NOISE。迷ったら MEMO。"+
    "答えは MEMO か NOISE の1語だけ。\n\n文：";
  async function isMyMemo(text){
    const key=gKey();if(!key)return true;
    for(const m of J_MODELS){
      try{
        const ac=new AbortController();const t=setTimeout(()=>ac.abort(),8000);
        const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},signal:ac.signal,
          body:JSON.stringify({contents:[{parts:[{text:JUDGE+text}]}],generationConfig:{temperature:0,maxOutputTokens:5}})});
        clearTimeout(t);
        if(!r.ok)continue;
        const j=await r.json();const a=((((j.candidates||[])[0]||{}).content||{}).parts||[]).map(p=>p.text||"").join("").toUpperCase();
        if(a.includes("NOISE"))return false;
        if(a.includes("MEMO"))return true;
      }catch(e){}
    }
    return true;
  }
  const RJ="tokie_memo_rejected_v1";
  function rejects(){try{const a=JSON.parse(localStorage.getItem(RJ)||"[]");return Array.isArray(a)?a:[];}catch(e){return [];}}
  function rejectAdd(t){const a=rejects();a.push({ts:Date.now(),text:t});try{localStorage.setItem(RJ,JSON.stringify(a.slice(-40)));}catch(e){}render();}
  function showErr(t){let el=document.getElementById("errLine");if(!el){el=document.createElement("div");el.id="errLine";el.style.cssText="color:#e89a8a;font-size:13px;line-height:1.5;margin:6px 0 0;word-break:break-word;text-align:center";ear.after(el);}el.textContent=t||"";}
  function renderKeyBox(show){
    let box=document.getElementById("keyBox");
    if(!show){if(box)box.remove();return;}
    if(box)return;
    box=document.createElement("div");box.id="keyBox";box.className="row";box.style.marginTop="8px";
    box.innerHTML='<input type="text" id="keyIn" placeholder="ElevenLabsのAPIキー（sk_…）"><button id="keyOk">入れる</button>';
    ear.after(box);
    box.querySelector("#keyOk").onclick=()=>{const v=box.querySelector("#keyIn").value.replace(/\s+/g,"");if(!v)return;try{localStorage.setItem("tokie_memo_el_key",v);}catch(e){}box.remove();wantEar=true;earStart();};
  }
  ear.onclick=()=>{if(stream){earStop();}else{wantEar=true;earStart();}};
  document.addEventListener("visibilitychange",()=>{if(document.hidden){if(stream){const w=wantEar;earStop();wantEar=w;}}else if(wantEar)earStart();});

  // ── 画面 ─────────────────────────────
  let showDone=false;
  function openCount(){return all().filter(x=>!x.done).length;}
  function rejBlock(){const a=rejects();if(!a.length)return "";return '<div class="exp" style="display:block"><button class="sm" id="rjT">テレビ・音楽として弾いた分（'+a.length+'件）'+(showRj?'を隠す':'を見る')+'</button>'+(showRj?'<ul>'+a.slice().reverse().map((x,i)=>'<li><div class="t" style="font-size:14px;color:var(--dim)">'+esc(x.text)+'<div class="when">'+when(x.ts)+'</div></div><button class="sm rjBack" data-i="'+(a.length-1-i)+'">メモに戻す</button></li>').join("")+'</ul>':'')+'</div>';}
  let showRj=false;
  function expBlock(){return '<div class="exp">実験中：夜でも中身を見せる <button class="sm '+(peek()?"on":"")+'" id="peek">'+(peek()?"オン":"オフ")+'</button><span>— 動くのを確かめたら「オフ」にする</span></div>';}
  function render(){
    const a=all(), open=a.filter(x=>!x.done);
    sub.textContent=isDay()?"喋るだけでメモ。朝8時前にClaudeへ届く。終わったら✓":"朝8時〜22時に中身を出す。今は喋るだけでええ";
    if(!isDay()&&!peek()){
      main.innerHTML='<div class="night"><div class="big">'+(open.length?"メモ "+open.length+"件、預かってる":"今夜はまだ何も")+'</div><div class="n">朝8時にClaudeが並べて出す。今は見んでええ。</div></div>'+expBlock();
      bind();return;
    }
    let h='<div class="bar"><button id="copyAll">全部コピー（Claudeに貼る用）</button><button class="sm" id="showDone">'+(showDone?"済みを隠す":"済みも見る")+'</button></div>';
    const list=(showDone?a:open).slice().reverse();
    h+=list.length?'<ul>'+list.map(x=>'<li class="'+(x.done?"done":"")+'" data-id="'+x.id+'"><button class="sm chk" title="済み">'+(x.done?"↩":"✓")+'</button><div><div class="t">'+esc(x.text)+'</div><div class="when">'+when(x.ts)+({tokie:"・ママ経由",ear:"・声",hand:"・手"}[x.from]||"")+'</div></div><button class="sm del" title="消す">✕</button></li>').join("")+'</ul>':'<div class="empty">まだ何もない。喋るだけでここに溜まる。トキエで「ママ、これメモしといて」でも入る。</div>';
    h+='<div class="row"><input type="text" id="manual" placeholder="手で足す"><button id="add">足す</button></div>';
    h+=rejBlock()+expBlock();
    main.innerHTML=h;bind();
  }
  function bind(){
    const rt=$("rjT");if(rt)rt.onclick=()=>{showRj=!showRj;render();};
    main.querySelectorAll(".rjBack").forEach(b=>b.onclick=()=>{const a=rejects();const i=+b.dataset.i;const x=a[i];if(!x)return;a.splice(i,1);try{localStorage.setItem(RJ,JSON.stringify(a));}catch(e){}addMemo(x.text,"ear");});
    const p=$("peek");if(p)p.onclick=()=>{localStorage.setItem(PEEK,peek()?"0":"1");render();};
    const c=$("copyAll");if(c)c.onclick=()=>{const open=all().filter(x=>!x.done);if(!open.length)return toast("空やで");copyText("昨夜のやつ：\n"+open.map(x=>"・"+x.text).join("\n"));};
    const sd=$("showDone");if(sd)sd.onclick=()=>{showDone=!showDone;render();};
    const ad=$("add");if(ad)ad.onclick=()=>{const v=$("manual").value.trim();if(!v)return;$("manual").value="";addMemo(v,"hand");};
    const mi=$("manual");if(mi){mi.onkeydown=(e)=>{if(e.key==="Enter")$("add").click();};mi.onfocus=()=>{if(stream){const w=wantEar;earStop();wantEar=w;}};mi.onblur=()=>{if(wantEar)earStart();};}
    main.querySelectorAll("li").forEach(li=>{
      const id=li.dataset.id;
      li.querySelector(".chk").onclick=()=>{const a=all();const x=a.find(y=>y.id===id);if(x){x.done=!x.done;save(a);render();if(x.done)api({op:"sent",ids:[id]}).catch(()=>{});else pushOne(x);}};
      li.querySelector(".del").onclick=()=>{if(!confirm("消す？"))return;save(all().filter(y=>y.id!==id));render();api({op:"del",ids:[id]}).catch(()=>{});};
    });
  }
  if(localStorage.getItem(PEEK)===null)localStorage.setItem(PEEK,"1"); // 実験中は最初からオン
  render();earStart();syncCloud();
  window.addEventListener("storage",(e)=>{if(e.key===KEY)render();}); // 別タブのトキエで足された時も即出す
  setInterval(render,60000);setInterval(syncCloud,5*60000);
})();
</script>
</body>
</html>
