<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12070a">
<title>スナックトキエ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--night:#12070a;--wine:#3a0d18;--rose:#ff6f91;--amber:#ffb85c;--cream:#fff1e2;--dim:#c9a99a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--night);color:var(--cream);font-family:"Zen Kaku Gothic New",sans-serif;overflow:hidden}
  body{display:flex;justify-content:center}
  .stage{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;align-items:center;
    padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
    background:radial-gradient(ellipse 120% 60% at 50% 0%,rgba(255,111,145,.18),transparent 60%),
      radial-gradient(ellipse 90% 50% at 50% 100%,rgba(255,184,92,.14),transparent 70%),
      linear-gradient(180deg,#1b0910 0%,#12070a 55%,#0b0406 100%)}
  .noren{display:flex;gap:6px;margin-top:4px}
  .noren span{width:46px;height:60px;background:linear-gradient(180deg,#5a1424,#3a0d18);border-radius:0 0 6px 6px;display:flex;align-items:center;justify-content:center;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:24px;color:var(--cream);box-shadow:inset 0 -6px 12px rgba(0,0,0,.35);animation:sway 6s ease-in-out infinite;transform-origin:top center}
  .noren span:nth-child(2){animation-delay:.3s}.noren span:nth-child(3){animation-delay:.6s}
  @keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(1.5deg)}}
  .neon{margin-top:22px;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:44px;letter-spacing:.25em;color:#ffe3ec;text-shadow:0 0 6px var(--rose),0 0 18px var(--rose),0 0 40px rgba(255,111,145,.7);animation:flick 5s infinite}
  @keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.4}94%{opacity:1}96%{opacity:.6}}
  .sub{font-size:11px;letter-spacing:.4em;color:var(--dim);margin-top:4px}
  .lamp{position:relative;margin-top:34px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#ffd9a3 0%,#ff9a6b 35%,#c23a5c 70%,#4a0f1f 100%);box-shadow:0 0 40px rgba(255,140,120,.45),0 0 120px rgba(255,111,145,.25);transition:transform .35s ease,box-shadow .35s ease}
  .lamp::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(255,184,92,.35)}
  .lamp .glass{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:76px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
  .stage.speaking .lamp{box-shadow:0 0 60px rgba(255,170,120,.7),0 0 160px rgba(255,111,145,.45);animation:breath 1.1s ease-in-out infinite}
  .stage.listening .lamp{box-shadow:0 0 30px rgba(255,184,92,.5),0 0 90px rgba(255,184,92,.25)}
  @keyframes breath{0%,100%{transform:scale(1.04)}50%{transform:scale(1.1)}}
  .status{margin-top:22px;font-size:13px;letter-spacing:.2em;color:var(--amber);min-height:18px}
  .caption{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:18px 4px;overflow:hidden}
  .mama{font-family:"Shippori Mincho B1",serif;font-weight:600;font-size:22px;line-height:1.6;text-align:center;color:#fff6ee;text-shadow:0 2px 12px rgba(0,0,0,.6);animation:fade .4s ease}
  .you{font-size:14px;text-align:center;color:var(--dim);animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .btn{width:100%;max-width:340px;padding:18px;border:none;border-radius:999px;font:700 18px "Zen Kaku Gothic New",sans-serif;letter-spacing:.2em;cursor:pointer;background:linear-gradient(90deg,#ff6f91,#ffb85c);color:#2a0a12;box-shadow:0 8px 30px rgba(255,111,145,.35)}
  .btn.out{background:transparent;color:var(--cream);border:1px solid rgba(255,241,226,.4);box-shadow:none}
  .btn:disabled{opacity:.5}
  .err{font-size:12px;color:#ff9a9a;margin-top:8px;text-align:center;min-height:14px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="noren"><span>ト</span><span>キ</span><span>エ</span></div>
  <div class="neon">トキエ</div>
  <div class="sub">SNACK TOKIE ・ 大阪 天満</div>
  <div class="lamp"><div class="glass">🥃</div></div>
  <div class="status" id="status">本日も営業中</div>
  <div class="caption" id="caption"></div>
  <button class="btn" id="btn">入店する</button>
  <div class="err" id="err"></div>
</div>
<script type="module">
  import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm";
  const AGENT_ID = "agent_7001m4xagrbxek580px43qgd8jza";
  const $ = (id) => document.getElementById(id);
  const stage=$("stage"),btn=$("btn"),statusEl=$("status"),caption=$("caption"),errEl=$("err");
  let conv=null;
  function show(text,who){const d=document.createElement("div");d.className=who==="ai"?"mama":"you";d.textContent=text;caption.appendChild(d);while(caption.children.length>3)caption.removeChild(caption.firstChild);}
  async function start(){
    errEl.textContent="";btn.disabled=true;statusEl.textContent="のれんをくぐってる…";
    try{
      await navigator.mediaDevices.getUserMedia({audio:true});
      conv=await Conversation.startSession({
        agentId:AGENT_ID,
        onConnect:()=>{statusEl.textContent="ママがカウンターに来た";btn.textContent="お会計";btn.className="btn out";btn.disabled=false;},
        onDisconnect:()=>end(),
        onMessage:(m)=>{if(m&&m.message)show(m.message,m.source);},
        onModeChange:(m)=>{const mode=m&&m.mode;stage.classList.toggle("speaking",mode==="speaking");stage.classList.toggle("listening",mode==="listening");statusEl.textContent=mode==="speaking"?"ママが話してる":"聞いてくれてる";},
        onError:(e)=>{errEl.textContent="エラー："+(e&&e.message?e.message:e);}
      });
    }catch(e){errEl.textContent=(e&&e.name==="NotAllowedError")?"マイクを許可してな":("つながらへん："+(e&&e.message?e.message:e));end();}
  }
  async function end(){try{if(conv)await conv.endSession();}catch(e){}conv=null;stage.classList.remove("speaking","listening");statusEl.textContent="またおいでな";btn.textContent="入店する";btn.className="btn";btn.disabled=false;}
  btn.addEventListener("click",()=>conv?end():start());
</script>
</body>
</html>
