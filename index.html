<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0507">
<title>スナックトキエ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--night:#0b0507;--rose:#ff5c8a;--pink:#ff9ec4;--amber:#ffb85c;--cream:#fff1e2;--dim:#d9b7a8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--night);color:var(--cream);font-family:"Zen Kaku Gothic New",sans-serif;overflow:hidden}
  body{display:flex;justify-content:center}
  .stage{position:relative;width:100%;max-width:480px;height:100%;overflow:hidden;display:flex;flex-direction:column;align-items:center;
    padding:max(20px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom))}
  /* ママの写真を背景いっぱいに */
  .photo{position:absolute;inset:0;background:url(mama.jpg) center top/cover no-repeat;transform:scale(1.04);transition:transform 6s ease}
  .stage.on .photo{transform:scale(1.1)}
  .veil{position:absolute;inset:0;background:
      linear-gradient(180deg,rgba(11,5,7,.55) 0%,rgba(11,5,7,0) 28%,rgba(11,5,7,0) 55%,rgba(11,5,7,.75) 78%,rgba(11,5,7,.96) 100%)}
  .glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 45% at 50% 42%,rgba(255,92,138,0),transparent 70%);transition:background .4s}
  .stage.speaking .glow{background:radial-gradient(ellipse 70% 45% at 50% 42%,rgba(255,92,138,.28),transparent 70%);animation:breath 1.2s ease-in-out infinite}
  @keyframes breath{0%,100%{opacity:.6}50%{opacity:1}}
  /* ボケ光 */
  .bokeh{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55;animation:float 9s ease-in-out infinite;pointer-events:none}
  .b1{width:14px;height:14px;left:12%;top:18%;background:var(--pink)}
  .b2{width:9px;height:9px;left:84%;top:26%;background:var(--amber);animation-delay:2s}
  .b3{width:18px;height:18px;left:70%;top:12%;background:var(--rose);animation-delay:4s;opacity:.35}
  .b4{width:7px;height:7px;left:28%;top:34%;background:#fff;animation-delay:1s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  /* 看板 */
  .top{position:relative;z-index:2;text-align:center}
  .neon{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:42px;letter-spacing:.3em;color:#ffe6ef;
    text-shadow:0 0 6px var(--rose),0 0 16px var(--rose),0 0 40px rgba(255,92,138,.8);animation:flick 6s infinite}
  @keyframes flick{0%,93%,100%{opacity:1}94%{opacity:.5}95%{opacity:1}97%{opacity:.7}}
  .sub{font-size:11px;letter-spacing:.45em;color:var(--dim);margin-top:2px}
  /* 下部 */
  .bottom{position:relative;z-index:2;margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
  .status{font-size:12px;letter-spacing:.25em;color:var(--amber);min-height:16px}
  .caption{width:100%;display:flex;flex-direction:column;gap:8px;min-height:120px;justify-content:flex-end}
  .mama{font-family:"Shippori Mincho B1",serif;font-weight:600;font-size:24px;line-height:1.55;text-align:center;color:#fff8f2;
    text-shadow:0 2px 14px rgba(0,0,0,.9),0 0 24px rgba(255,92,138,.35);animation:fade .4s ease}
  .you{font-size:14px;text-align:center;color:var(--dim);text-shadow:0 1px 8px rgba(0,0,0,.9);animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .btn{width:100%;max-width:340px;padding:17px;border:none;border-radius:999px;font:700 17px "Zen Kaku Gothic New",sans-serif;letter-spacing:.25em;cursor:pointer;
    background:linear-gradient(90deg,#ff5c8a,#ffb85c);color:#2a0a12;box-shadow:0 8px 30px rgba(255,92,138,.45)}
  .btn.out{background:rgba(11,5,7,.5);color:var(--cream);border:1px solid rgba(255,241,226,.45);box-shadow:none;backdrop-filter:blur(6px)}
  .btn:disabled{opacity:.5}
  .err{font-size:12px;color:#ff9a9a;text-align:center;min-height:14px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="photo"></div>
  <div class="veil"></div>
  <div class="glow"></div>
  <i class="bokeh b1"></i><i class="bokeh b2"></i><i class="bokeh b3"></i><i class="bokeh b4"></i>

  <div class="top">
    <div class="neon">トキエ</div>
    <div class="sub">SNACK TOKIE ・ 大阪 天満</div>
  </div>

  <div class="bottom">
    <div class="caption" id="caption"></div>
    <div class="status" id="status">本日も営業中</div>
    <button class="btn" id="btn">入店する</button>
    <div class="err" id="err"></div>
  </div>
</div>
<script type="module">
  import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm";
  const AGENT_ID = "agent_7001m4xagrbxek580px43qgd8jza";
  const $ = (id) => document.getElementById(id);
  const stage=$("stage"),btn=$("btn"),statusEl=$("status"),caption=$("caption"),errEl=$("err");
  let conv=null;
  function show(text,who){const d=document.createElement("div");d.className=who==="ai"?"mama":"you";d.textContent=text;caption.appendChild(d);while(caption.children.length>2)caption.removeChild(caption.firstChild);}
  async function start(){
    errEl.textContent="";btn.disabled=true;statusEl.textContent="のれんをくぐってる…";
    try{
      await navigator.mediaDevices.getUserMedia({audio:true});
      conv=await Conversation.startSession({
        agentId:AGENT_ID,
        onConnect:()=>{stage.classList.add("on");statusEl.textContent="ママがカウンターに来た";btn.textContent="お会計";btn.className="btn out";btn.disabled=false;},
        onDisconnect:()=>end(),
        onMessage:(m)=>{if(m&&m.message)show(m.message,m.source);},
        onModeChange:(m)=>{const mode=m&&m.mode;stage.classList.toggle("speaking",mode==="speaking");statusEl.textContent=mode==="speaking"?"ママが話してる":"聞いてくれてる";},
        onError:(e)=>{errEl.textContent="エラー："+(e&&e.message?e.message:e);}
      });
    }catch(e){errEl.textContent=(e&&e.name==="NotAllowedError")?"マイクを許可してな":("つながらへん："+(e&&e.message?e.message:e));end();}
  }
  async function end(){try{if(conv)await conv.endSession();}catch(e){}conv=null;stage.classList.remove("speaking","on");statusEl.textContent="またおいでな";btn.textContent="入店する";btn.className="btn";btn.disabled=false;}
  btn.addEventListener("click",()=>conv?end():start());
</script>
</body>
</html>
