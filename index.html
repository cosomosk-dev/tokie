<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0507">
<title>スナックトキエ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--night:#0b0507;--rose:#ff5c8a;--pink:#ff9ec4;--amber:#ffb85c;--cream:#fff1e2;--dim:#d9b7a8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--night);color:var(--cream);font-family:"Zen Kaku Gothic New",sans-serif;overflow:hidden}
  body{display:flex;justify-content:center}
  .stage{position:relative;width:100%;max-width:480px;height:100%;overflow:hidden;display:flex;flex-direction:column;align-items:center;
    padding:max(20px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom))}
  /* ママの写真を背景いっぱいに */
  .photo{position:absolute;inset:0;background:url(mama.jpg) center top/cover no-repeat;transform:scale(1.04);transition:transform 6s ease}
  .stage.on .photo{transform:scale(1.1)}
  .veil{position:absolute;inset:0;background:
      linear-gradient(180deg,rgba(11,5,7,.55) 0%,rgba(11,5,7,0) 28%,rgba(11,5,7,0) 55%,rgba(11,5,7,.75) 78%,rgba(11,5,7,.96) 100%)}
  .glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 45% at 50% 42%,rgba(255,92,138,0),transparent 70%);transition:background .4s}
  .stage.speaking .glow{background:radial-gradient(ellipse 70% 45% at 50% 42%,rgba(255,92,138,.28),transparent 70%);animation:breath 1.2s ease-in-out infinite}
  @keyframes breath{0%,100%{opacity:.6}50%{opacity:1}}
  /* ボケ光 */
  .bokeh{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55;animation:float 9s ease-in-out infinite;pointer-events:none}
  .b1{width:14px;height:14px;left:12%;top:18%;background:var(--pink)}
  .b2{width:9px;height:9px;left:84%;top:26%;background:var(--amber);animation-delay:2s}
  .b3{width:18px;height:18px;left:70%;top:12%;background:var(--rose);animation-delay:4s;opacity:.35}
  .b4{width:7px;height:7px;left:28%;top:34%;background:#fff;animation-delay:1s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  /* 看板 */
  .top{position:relative;z-index:2;text-align:center}
  .neon{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:42px;letter-spacing:.3em;color:#ffe6ef;
    text-shadow:0 0 6px var(--rose),0 0 16px var(--rose),0 0 40px rgba(255,92,138,.8);animation:flick 6s infinite}
  @keyframes flick{0%,93%,100%{opacity:1}94%{opacity:.5}95%{opacity:1}97%{opacity:.7}}
  .sub{font-size:11px;letter-spacing:.45em;color:var(--dim);margin-top:2px}
  /* 手帳ボタン（右上） */
  .notebtn{position:absolute;z-index:3;top:max(18px,env(safe-area-inset-top));right:16px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,241,226,.4);
    background:rgba(11,5,7,.45);color:var(--cream);font:700 12px "Zen Kaku Gothic New",sans-serif;letter-spacing:.15em;backdrop-filter:blur(6px);cursor:pointer}
  .notebtn small{display:block;font-weight:400;font-size:9px;letter-spacing:.05em;color:var(--dim)}
  /* 下部 */
  .bottom{position:relative;z-index:2;margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
  .status{font-size:12px;letter-spacing:.25em;color:var(--amber);min-height:16px}
  .caption{width:100%;display:flex;flex-direction:column;gap:8px;min-height:120px;justify-content:flex-end}
  .mama{font-family:"Shippori Mincho B1",serif;font-weight:600;font-size:24px;line-height:1.55;text-align:center;color:#fff8f2;
    text-shadow:0 2px 14px rgba(0,0,0,.9),0 0 24px rgba(255,92,138,.35);animation:fade .4s ease}
  .you{font-size:14px;text-align:center;color:var(--dim);text-shadow:0 1px 8px rgba(0,0,0,.9);animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .btn{width:100%;max-width:340px;padding:17px;border:none;border-radius:999px;font:700 17px "Zen Kaku Gothic New",sans-serif;letter-spacing:.25em;cursor:pointer;
    background:linear-gradient(90deg,#ff5c8a,#ffb85c);color:#2a0a12;box-shadow:0 8px 30px rgba(255,92,138,.45)}
  .btn.out{background:rgba(11,5,7,.5);color:var(--cream);border:1px solid rgba(255,241,226,.45);box-shadow:none;backdrop-filter:blur(6px)}
  .btn:disabled{opacity:.5}
  .err{font-size:12px;color:#ff9a9a;text-align:center;min-height:14px}
  /* 入れへんかった時のお知らせ（クレジット切れ・上限時間・回線切れ） */
  .notice{display:none;width:100%;max-width:340px;padding:14px 16px;border-radius:16px;text-align:center;animation:fade .4s ease;
    background:rgba(11,5,7,.72);border:1px solid rgba(255,184,92,.55);backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .notice.show{display:block}
  .notice.credit{border-color:rgba(255,92,138,.7)}
  .notice b{display:block;font-family:"Shippori Mincho B1",serif;font-size:16px;letter-spacing:.08em;color:#ffe6ef;margin-bottom:6px;text-shadow:0 0 10px rgba(255,92,138,.5)}
  .notice p{font-size:12px;line-height:1.7;color:var(--cream)}
  .notice a{display:inline-block;margin-top:10px;padding:9px 16px;border-radius:999px;background:var(--amber);color:#2a0a12;font-weight:700;font-size:12px;letter-spacing:.1em;text-decoration:none}
  .notice small{display:block;margin-top:8px;font-size:10px;line-height:1.5;color:var(--dim);word-break:break-all}
  .bottom.has-notice .caption{min-height:0}
  /* ママの手帳（モーダル） */
  .sheet{position:fixed;inset:0;z-index:10;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
  .sheet.open{display:flex}
  .book{width:100%;max-width:480px;max-height:92%;overflow:auto;background:#1a0d12;border-radius:22px 22px 0 0;border-top:1px solid rgba(255,158,196,.35);
    padding:18px 18px max(22px,env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.6)}
  .book h2{font-family:"Shippori Mincho B1",serif;font-size:20px;letter-spacing:.2em;color:#ffe6ef;text-shadow:0 0 10px rgba(255,92,138,.6);text-align:center}
  .book .lead{font-size:12px;color:var(--dim);text-align:center;margin:6px 0 10px;line-height:1.6}
  .book label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.1em;color:var(--amber);margin:16px 0 6px}
  .book label span{font-size:10px;letter-spacing:.05em;color:var(--dim)}
  .book textarea{width:100%;min-height:96px;border-radius:12px;border:1px solid rgba(255,241,226,.25);background:rgba(255,241,226,.06);color:var(--cream);
    padding:10px 12px;font:14px/1.6 "Zen Kaku Gothic New",sans-serif;resize:vertical}
  .book textarea.big{min-height:180px}
  .hint{font-size:11px;color:var(--dim);line-height:1.6;margin-top:6px}
  .visit{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,241,226,.05);border:1px solid rgba(255,241,226,.12)}
  .visit.note{border-color:rgba(255,184,92,.35);background:rgba(255,184,92,.06)}
  .visit .d{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--pink);letter-spacing:.08em}
  .visit.note .d{color:var(--amber)}
  .visit .d button{border:none;background:none;color:var(--dim);font-size:11px;cursor:pointer;padding:4px 6px}
  .visit pre{white-space:pre-wrap;word-break:break-word;font:13px/1.6 "Zen Kaku Gothic New",sans-serif;color:var(--cream);margin-top:6px;max-height:160px;overflow:auto}
  .empty{font-size:13px;color:var(--dim);text-align:center;padding:14px 0}
  .row{display:flex;gap:10px;margin-top:12px}
  .row button{flex:1;padding:12px 8px;border-radius:999px;border:1px solid rgba(255,241,226,.35);background:none;color:var(--cream);font:700 13px "Zen Kaku Gothic New",sans-serif;letter-spacing:.1em;cursor:pointer}
  .row button.primary{background:linear-gradient(90deg,#ff5c8a,#ffb85c);color:#2a0a12;border:none}
  .row button.amber{border-color:rgba(255,184,92,.6);color:var(--amber)}
  .row button.danger{color:#ff9a9a;border-color:rgba(255,154,154,.4)}
  .row button:disabled{opacity:.4}
  .saved{font-size:11px;color:var(--amber);text-align:center;min-height:14px;margin-top:6px}
  .meter{font-size:11px;color:var(--dim);text-align:center;margin-top:14px;line-height:1.6;padding-top:12px;border-top:1px dashed rgba(255,241,226,.15)}
  .restore{display:none;margin-top:10px}
  .restore.open{display:block}
  details{margin-top:18px;border-top:1px dashed rgba(255,241,226,.15);padding-top:10px}
  summary{font-size:12px;letter-spacing:.1em;color:var(--amber);cursor:pointer;list-style:none}
  summary::before{content:"▸ ";color:var(--dim)}
  details[open] summary::before{content:"▾ "}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="photo"></div>
  <div class="veil"></div>
  <div class="glow"></div>
  <i class="bokeh b1"></i><i class="bokeh b2"></i><i class="bokeh b3"></i><i class="bokeh b4"></i>

  <button class="notebtn" id="notebtn">手帳<small id="notecount">来店 0回</small></button>

  <div class="top">
    <div class="neon">トキエ</div>
    <div class="sub">SNACK TOKIE ・ 大阪 天満</div>
  </div>

  <div class="bottom" id="bottom">
    <div class="caption" id="caption"></div>
    <div class="notice" id="notice"></div>
    <div class="status" id="status">本日も営業中</div>
    <button class="btn" id="btn">入店する</button>
    <div class="err" id="err"></div>
  </div>
</div>

<!-- ママの手帳 -->
<div class="sheet" id="sheet">
  <div class="book">
    <h2>ママの手帳</h2>
    <p class="lead">閉店しても忘れへんように、ママが書き留めとく帳面。<br>次に入店したとき、ママはこの手帳を読んでから迎えてくれる。<br>この手帳は消さへん限りずっと残る。</p>

    <label>お客さんの基本情報（ママに最初から知っといてほしいこと）<span id="profilelen">0文字</span></label>
    <textarea id="profile" class="big" placeholder="1000文字くらいでOK。例：名前はタケオ。39歳、平塚。アプリを作ってる。酒は弱い。好きな話題は…"></textarea>
    <div class="saved" id="saved"></div>

    <label>ママに覚えといてほしいメモ（コピペOK・何回でも足せる）</label>
    <textarea id="newnote" placeholder="他で話した内容（Claudeとのやりとり等）をそのまま貼って「手帳に書き足す」。"></textarea>
    <div class="row">
      <button class="amber" id="addnote">手帳に書き足す</button>
    </div>
    <div class="saved" id="notesaved"></div>

    <label>これまでの来店メモと手書きメモ（新しい順・全部残る）<span id="visitcount"></span></label>
    <div id="visits"></div>

    <div class="meter" id="meter"></div>

    <details>
      <summary>控え（バックアップ）・白紙にする</summary>
      <p class="hint">手帳はこのスマホ／PCのブラウザの中に保存してある。別の端末や、ブラウザのデータを消した時に備えて、たまに「控えをコピー」してメモアプリ等に貼っとくと安心。戻すときは「控えを貼って戻す」。</p>
      <div class="row">
        <button id="copybook">控えをコピー</button>
        <button id="restoretoggle">控えを貼って戻す</button>
      </div>
      <div class="restore" id="restore">
        <textarea id="restoretext" placeholder="コピーしといた控えをここに貼る"></textarea>
        <div class="row">
          <button class="amber" id="restorebtn">この控えで戻す（今の手帳に足す）</button>
        </div>
      </div>
      <div class="row">
        <button class="danger" id="clearall">手帳を全部白紙にする</button>
      </div>
    </details>

    <div class="row">
      <button class="primary" id="closebook">閉じる</button>
    </div>
  </div>
</div>

<script type="module">
  import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm";
  const AGENT_ID = "agent_7001m4xagrbxek580px43qgd8jza";
  const $ = (id) => document.getElementById(id);
  const stage=$("stage"),btn=$("btn"),statusEl=$("status"),caption=$("caption"),errEl=$("err");
  let conv=null;

  /* ───────── ママの手帳（ブラウザ内に保存・上限なし・消さへん限り残る） ───────── */
  const KEY="tokie_notebook_v1";
  // ママに一度に渡す記憶の上限（文字）。手帳そのものは無制限に残るが、ママが毎回読む量だけはこれで区切る（長すぎると返事が遅く・高くなる）
  const MAX_MEMORY_CHARS=24000;
  const empty=()=>({profile:"",visits:[]});
  function loadBook(){try{const b=JSON.parse(localStorage.getItem(KEY)||"null");return (b&&typeof b==="object")?{profile:b.profile||"",visits:Array.isArray(b.visits)?b.visits:[]}:empty();}catch(e){return empty();}}
  let saveWarned=false;
  function saveBook(b){
    try{localStorage.setItem(KEY,JSON.stringify(b));return true;}
    catch(e){
      if(!saveWarned){saveWarned=true;alert("手帳がいっぱいで書けへん。「控えをコピー」して控えを取ってから、古いメモを少し消してな。");}
      return false;
    }
  }
  // ブラウザに「このサイトのデータは勝手に消さんといて」と頼む（対応ブラウザのみ）
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}
  const clip=(t,n)=>t.length>n?t.slice(0,n)+"…":t;
  const jstDate=(d)=>d.toLocaleDateString("ja-JP",{year:"numeric",month:"numeric",day:"numeric",timeZone:"Asia/Tokyo"});
  const jstTime=(d)=>d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Tokyo"});

  // 1回の会話 → ざっくりメモ。お客さんが喋った内容を中心に（長い発言＝中身がある発言を優先）、最後のママの一言も添える
  function digest(msgs){
    const seen=new Set();
    const users=msgs.filter(m=>m.who==="user").map(m=>m.text.trim()).filter(t=>t.length>=6&&!seen.has(t)&&seen.add(t));
    let pick=users.map((t,i)=>({t,i}));
    if(pick.length>40){pick=pick.slice().sort((a,b)=>b.t.length-a.t.length).slice(0,40).sort((a,b)=>a.i-b.i);}
    const lines=pick.map(p=>"客: "+clip(p.t,100));
    const ais=msgs.filter(m=>m.who==="ai").map(m=>m.text.trim()).filter(Boolean);
    if(ais.length)lines.push("ママ(最後の一言): "+clip(ais[ais.length-1],60));
    return lines.join("\n");
  }

  // 今の会話を手帳に書き込む（会話中は上書きし続けるので、途中でブラウザを閉じても残る）
  let current=null; // {id,start,msgs}
  function writeCurrent(){
    if(!current||!current.msgs.some(m=>m.who==="user"))return;
    const b=loadBook();
    const mins=Math.max(1,Math.round((Date.now()-current.start)/60000));
    const v={id:current.id,kind:"visit",date:jstDate(new Date(current.start)),time:jstTime(new Date(current.start)),mins,memo:digest(current.msgs)};
    const idx=b.visits.findIndex(x=>x.id===current.id);
    if(idx>=0)b.visits[idx]=v;else b.visits.unshift(v);
    saveBook(b);renderCount();
  }

  // 手書きメモ（コピペ）を手帳に足す
  function addNote(text){
    text=String(text||"").trim();if(!text)return false;
    const b=loadBook();const now=new Date();
    b.visits.unshift({id:"n"+Date.now(),kind:"note",date:jstDate(now),time:jstTime(now),mins:0,memo:text});
    const ok=saveBook(b);renderCount();return ok;
  }

  // ママに渡す「記憶」を組み立てる。基本情報は必ず全部、次に手書きメモ（新しい順）、最後に来店メモ（新しい順）。長すぎたら古い来店メモから省く
  function buildMemory(extension){
    const b=loadBook();
    const parts=[];
    if(extension)parts.push("【いまの状況】さっきまで2時間しゃべってて、そのまま延長に入ったところ。挨拶し直さず、下の来店メモの一番新しい話の続きから自然に話す。");
    parts.push("【お客さんの基本情報】\n"+(b.profile.trim()||"（まだ書いてない）"));
    const notes=b.visits.filter(v=>v.kind==="note"), visits=b.visits.filter(v=>v.kind!=="note");
    let used=parts[0].length;
    if(notes.length){
      let body="";
      for(const n of notes){
        const block=`■${n.date}に書いたメモ\n${n.memo}\n`;
        if(used+body.length+block.length>MAX_MEMORY_CHARS)break;
        body+=block;
      }
      if(body){parts.push("【お客さんについてママが書き留めたこと（新しい順）】\n"+body.trim());used+=body.length;}
    }
    if(!visits.length){parts.push("【これまでの来店メモ】\n（初来店。まだ何も書いてない）");}
    else{
      let body="";
      for(const v of visits){
        const block=`■${v.date} ${v.time}（${v.mins}分）\n${v.memo}\n`;
        if(used+body.length+block.length>MAX_MEMORY_CHARS)break;
        body+=block;
      }
      parts.push("【これまでの来店メモ（新しい順）】\n"+(body.trim()||"（古すぎて省略）"));
    }
    return parts.join("\n\n");
  }
  function lastVisitText(){
    const b=loadBook();const visits=b.visits.filter(v=>v.kind!=="note");if(!visits.length)return "初来店";
    const last=visits[0];const d=Math.round((new Date(jstDate(new Date()))-new Date(last.date))/86400000);
    return d<=0?"今日":d===1?"昨日":`${d}日前`;
  }
  function visitCount(){return loadBook().visits.filter(v=>v.kind!=="note").length;}
  function renderCount(){const n=visitCount();$("notecount").textContent=`来店 ${n}回`+(n?`・${lastVisitText()}`:"");}

  /* ───────── 手帳の画面 ───────── */
  const sheet=$("sheet"),profileEl=$("profile"),visitsEl=$("visits"),savedEl=$("saved"),profileLen=$("profilelen");
  function renderBook(){
    const b=loadBook();profileEl.value=b.profile;profileLen.textContent=`${b.profile.length}文字`;
    visitsEl.innerHTML="";
    const n=visitCount(),m=b.visits.length-n;
    $("visitcount").textContent=`来店${n}回・手書き${m}件`;
    if(!b.visits.length){visitsEl.innerHTML='<div class="empty">まだ何もない。一回話して「お会計」したら来店メモが書き込まれる。</div>';}
    for(const v of b.visits){
      const d=document.createElement("div");d.className="visit"+(v.kind==="note"?" note":"");
      const head=document.createElement("div");head.className="d";
      head.innerHTML=v.kind==="note"?`<span>✎ ${v.date} ${v.time}・手書きメモ</span>`:`<span>${v.date} ${v.time}・${v.mins}分</span>`;
      const del=document.createElement("button");del.textContent="このメモを消す";
      del.onclick=()=>{if(!confirm("このメモを消す？"))return;const bb=loadBook();bb.visits=bb.visits.filter(x=>x.id!==v.id);saveBook(bb);renderBook();renderCount();};
      head.appendChild(del);
      const pre=document.createElement("pre");pre.textContent=v.memo||"（メモなし）";
      d.appendChild(head);d.appendChild(pre);visitsEl.appendChild(d);
    }
    const mem=buildMemory();const total=JSON.stringify(b).length;
    $("meter").textContent=`ママが入店時に読む量：${mem.length.toLocaleString()}文字（上限${MAX_MEMORY_CHARS.toLocaleString()}文字。超えた分は古い来店メモから省く）／手帳全体：${total.toLocaleString()}文字`;
  }
  let saveTimer=null;
  profileEl.addEventListener("input",()=>{const b=loadBook();b.profile=profileEl.value;profileLen.textContent=`${profileEl.value.length}文字`;if(saveBook(b))savedEl.textContent="保存した";clearTimeout(saveTimer);saveTimer=setTimeout(()=>savedEl.textContent="",1500);});
  $("addnote").addEventListener("click",()=>{
    const t=$("newnote").value;
    if(!t.trim()){$("notesaved").textContent="何か書いてから押してな";return;}
    if(addNote(t)){$("newnote").value="";$("notesaved").textContent="手帳に書き足した";renderBook();setTimeout(()=>$("notesaved").textContent="",2000);}
  });
  $("notebtn").addEventListener("click",()=>{renderBook();sheet.classList.add("open");});
  $("closebook").addEventListener("click",()=>sheet.classList.remove("open"));
  sheet.addEventListener("click",(e)=>{if(e.target===sheet)sheet.classList.remove("open");});
  $("clearall").addEventListener("click",()=>{if(!confirm("手帳を全部白紙にする？（基本情報も来店メモも手書きメモも消える。控えを取ってへんなら先に「控えをコピー」）"))return;saveBook(empty());renderBook();renderCount();});
  // 控え（バックアップ）
  $("copybook").addEventListener("click",async()=>{
    const text="TOKIE_NOTEBOOK\n"+JSON.stringify(loadBook());
    try{await navigator.clipboard.writeText(text);$("notesaved").textContent="控えをコピーした。メモアプリ等に貼って残しといて";}
    catch(e){prompt("この文を全部コピーして控えにして",text);}
    setTimeout(()=>$("notesaved").textContent="",3000);
  });
  $("restoretoggle").addEventListener("click",()=>$("restore").classList.toggle("open"));
  $("restorebtn").addEventListener("click",()=>{
    const raw=$("restoretext").value.trim();
    let data=null;
    try{data=JSON.parse(raw.replace(/^TOKIE_NOTEBOOK\s*/,""));}catch(e){}
    if(!data||typeof data!=="object"){alert("控えの形が違うみたい。「控えをコピー」で出た文をそのまま貼ってな");return;}
    const b=loadBook();
    if(!b.profile.trim()&&data.profile)b.profile=String(data.profile);
    const ids=new Set(b.visits.map(x=>x.id));
    for(const v of (Array.isArray(data.visits)?data.visits:[])){if(v&&v.id&&!ids.has(v.id)){b.visits.push(v);ids.add(v.id);}}
    b.visits.sort((a,c)=>String(c.id).replace(/^n/,"").localeCompare(String(a.id).replace(/^n/,""),undefined,{numeric:true}));
    if(saveBook(b)){$("restoretext").value="";$("restore").classList.remove("open");renderBook();renderCount();alert("控えから戻した");}
  });
  renderCount();

  /* ───────── 会話 ───────── */
  const notice=$("notice"),bottom=$("bottom");
  const ELEVEN_SUB="https://elevenlabs.io/app/subscription";
  let connectedAt=null, serverErr=null, ending=false;
  function show(text,who){text=String(text).replace(/\[[^\]]*\]/g,"").replace(/\s{2,}/g," ").trim();if(!text)return;const d=document.createElement("div");d.className=who==="ai"?"mama":"you";d.textContent=text;caption.appendChild(d);while(caption.children.length>2)caption.removeChild(caption.firstChild);return text;}
  function hideNotice(){notice.className="notice";notice.innerHTML="";bottom.classList.remove("has-notice");}
  function showNotice(kind,title,body,link,detail){
    notice.className="notice show "+kind;
    notice.innerHTML="";
    const b=document.createElement("b");b.textContent=title;notice.appendChild(b);
    const p=document.createElement("p");p.textContent=body;notice.appendChild(p);
    if(link){const a=document.createElement("a");a.href=link.href;a.target="_blank";a.rel="noopener";a.textContent=link.label;notice.appendChild(a);}
    if(detail){const s=document.createElement("small");s.textContent="詳細: "+detail;notice.appendChild(s);}
    bottom.classList.add("has-notice");
  }
  // 切れた理由を見分ける。ElevenLabsから返ってきた文言・サーバーエラー・つながる前に切れたか、で判定
  function diagnose(d){
    if(!d||d.reason==="user")return {kind:"user"};
    const ctx=d.context||{};
    const bits=[d.reason,d.message,d.closeCode,d.closeReason,ctx.type,ctx.reason,ctx.code,
      serverErr&&serverErr.msg,serverErr&&serverErr.ctx&&serverErr.ctx.errorType,serverErr&&serverErr.ctx&&serverErr.ctx.code].filter(x=>x!==undefined&&x!==null&&x!=="");
    const detail=bits.join(" / ");
    const text=detail.toLowerCase();
    if(ctx.type==="max_duration_exceeded"||/max_duration/.test(text))return {kind:"maxdur",detail};
    if(/quota|credit|insufficient|402|payment|subscription|usage|billing/.test(text))return {kind:"credit",sure:true,detail};
    if(/exceed|limit|unauthorized|401|403/.test(text))return {kind:"credit",sure:false,detail};
    const talked=current&&current.msgs.some(m=>m.who==="user");
    const elapsed=current?Date.now()-current.start:0;
    if(!connectedAt||(!talked&&elapsed<25000))return {kind:"credit",sure:false,detail};   // 入店できずに即切れ＝ほぼクレジット切れ
    return {kind:"dropped",detail};
  }
  const GREETING="あら、おかえり。今日も来てくれたんやね、嬉しいわぁ。ほら、こっち座って。";
  const GREETING_EXT="はい、延長な。ほんで、さっきの話の続きやけど…";
  const MAX_AUTO_EXTENSIONS=5; // 2時間×(1+5)＝最長12時間まで自動で入り直す（切り忘れ防止）
  let extensions=0;
  async function start(extension){
    if(!extension)extensions=0;
    errEl.textContent="";hideNotice();btn.disabled=true;statusEl.textContent=extension?"延長入るで…":"ママが手帳を読んでる…";
    connectedAt=null;serverErr=null;
    try{
      try{await navigator.mediaDevices.getUserMedia({audio:true});}
      catch(e){errEl.textContent=(e&&e.name==="NotAllowedError")?"マイクを許可してな":"マイクが使えへん："+String(e&&e.message?e.message:e);statusEl.textContent="またおいでな";btn.disabled=false;return;}
      const memory=buildMemory(extension);
      current={id:String(Date.now()),start:Date.now(),msgs:[]};
      conv=await Conversation.startSession({
        agentId:AGENT_ID,
        dynamicVariables:{memory, visit_count:String(visitCount()), last_visit:lastVisitText(), greeting:extension?GREETING_EXT:GREETING},
        onConnect:()=>{connectedAt=Date.now();stage.classList.add("on");statusEl.textContent="ママがカウンターに来た";btn.textContent="お会計";btn.className="btn out";btn.disabled=false;},
        onDisconnect:(d)=>end(d),
        onMessage:(m)=>{if(m&&m.message){const t=show(m.message,m.source);if(t&&current){current.msgs.push({who:m.source==="ai"?"ai":"user",text:t});writeCurrent();}}},
        onModeChange:(m)=>{const mode=m&&m.mode;stage.classList.toggle("speaking",mode==="speaking");statusEl.textContent=mode==="speaking"?"ママが話してる":"聞いてくれてる";},
        onError:(msg,ctx)=>{serverErr={msg:String(msg&&msg.message?msg.message:msg),ctx:ctx||{}};errEl.textContent="エラー："+serverErr.msg;}
      });
    }catch(e){
      const msg=String(e&&e.message?e.message:e);
      errEl.textContent="つながらへん："+msg;
      end({reason:"error",message:msg,context:{type:"start_failed"}});
    }
  }
  async function end(d){
    if(ending)return;ending=true;
    const c=conv;conv=null;
    try{if(c)await c.endSession();}catch(e){}
    stage.classList.remove("speaking","on");
    const r=diagnose(d);
    if(current){writeCurrent();current=null;}
    if(r.kind==="user"){
      statusEl.textContent="ママが手帳に書いてる…";setTimeout(()=>{statusEl.textContent="またおいでな";},1200);
    }else if(r.kind==="credit"){
      errEl.textContent="";statusEl.textContent=r.sure?"クレジット切れ":"入店できへん（たぶんクレジット切れ）";
      showNotice("credit",
        r.sure?"ママ：堪忍な、クレジット切れや":"ママ：堪忍な、たぶんクレジット切れや",
        "ElevenLabsの今月ぶんの通話時間を使い切ったみたい。追加クレジットを買うか、プランを一段上げたら、すぐまた入れる。",
        {href:ELEVEN_SUB,label:"ElevenLabsの料金ページを開く"},r.detail);
    }else if(r.kind==="maxdur"){
      if(extensions<MAX_AUTO_EXTENSIONS){
        // 2時間の上限で切れた → 数秒後に自動で入り直す（ママは「延長な」で続きから）
        extensions++;
        statusEl.textContent="延長入るで…";
        btn.textContent="お会計";btn.className="btn out";btn.disabled=true;ending=false;
        setTimeout(()=>start(true),1500);
        return;
      }
      statusEl.textContent="今日はもう閉店や";
      showNotice("maxdur","ママ：今日はほんまにここまでやで",
        "長時間つなぎっぱなしやったから、いったん閉店にした。また入店したら続きから話せる（手帳は残ってる）。",
        null,r.detail);
    }else{
      statusEl.textContent="回線が切れた";
      showNotice("dropped","ママ：あら、切れてもうた",
        "途中で回線が切れた。電波かElevenLabs側の都合。もう一回入店してみて。",
        null,r.detail);
    }
    btn.textContent="入店する";btn.className="btn";btn.disabled=false;ending=false;
  }
  btn.addEventListener("click",()=>conv?end():start(false));
</script>
</body>
</html>
